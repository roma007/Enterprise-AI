# ai-copilot HTTPS 反向代理（D5）
#
# 用法：把本文件放进 nginx 的 conf.d/，替换 __SERVER_NAME__ / __CERT__ / __KEY__，
#      并确认 upstream 端口与 ai-copilot 一致（默认 127.0.0.1:8790）。
#
# 生产建议：
#   - 证书用 Let's Encrypt / 客户 CA；不要把私钥放进版本库
#   - 确认全站 HTTPS 后再开 HSTS；首次上线可先注释 HSTS
#   - METRICS_TOKEN 必须配置，且 /metrics 只在监控网段放行
#   - ai-copilot 启动时设 COOKIE_SECURE=true

server {
    listen       __HTTP_PORT__;
    server_name  __SERVER_NAME__;
    return 301 https://$host$request_uri;
}

server {
    listen               __HTTPS_PORT__ ssl;
    http2                on;
    server_name          __SERVER_NAME__;

    ssl_certificate      __CERT__;
    ssl_certificate_key  __KEY__;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;

    # OCR 上传与 PDF 可能较大；按客户实际调整
    client_max_body_size 50m;

    add_header X-Content-Type-Options  nosniff always;
    add_header X-Frame-Options         SAMEORIGIN always;
    add_header Referrer-Policy         no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass              http://__UPSTREAM__;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;

        # OCR / 模型调用可能超过 60 秒
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
        proxy_connect_timeout   10s;
    }

    # 只让监控网段抓取；同时要求 ai-copilot 配 METRICS_TOKEN
    # location = /metrics {
    #     allow 10.0.0.0/8;
    #     deny all;
    #     proxy_pass http://__UPSTREAM__;
    #     proxy_set_header X-Forwarded-Proto https;
    # }
}
