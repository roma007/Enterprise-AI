<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>智单 · 关务助手</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1b2430;--muted:#6b7684;--brand:#1f4e79;--err:#c53030;--ok:#2f855a;--warn:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  .wrap{padding:16px;max-width:1120px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
  textarea{width:100%;min-height:110px;border:0;padding:12px;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none;resize:vertical;background:#fcfcfd;color:var(--ink)}
  .bar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  button{font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .hint{color:var(--muted);font-size:12px;margin-left:auto}
  .selected{font-size:13.5px;line-height:1.8;background:#f8fbfe;border-left:3px solid #bfd7ea;padding:10px 12px;border-radius:4px}
  .selected b{color:var(--brand)}
  .warn{background:#fff8e8;border:1px solid #f1dcae;color:#7a5200;padding:9px 12px;border-radius:8px;font-size:12.5px;margin:0 14px 12px}
  table{width:100%;border-collapse:collapse;font-size:12.8px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);background:#fafbfc;font-weight:600;white-space:nowrap}
  .tag{padding:2px 9px;border-radius:999px;font-size:11.5px;background:#eef2f7;color:var(--muted);white-space:nowrap}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
<link rel="stylesheet" href="/static/nav.css?v=20261108g" />
<script src="/static/nav.js?v=20261108g" defer></script>
</head>
<body class="app-shell">
<header>
  <h1>关务助手</h1>
  <span class="sub">商品描述 → HS 候选；编码必须来自词库/历史记录，不硬猜</span>
</header>

<div class="wrap">
  <section class="card">
    <h2>① 商品描述</h2>
    <textarea id="desc" placeholder="例如：家用微波炉，电热器具，出口英国"></textarea>
    <div class="bar">
      <button class="primary" id="btnRun">查 HS 候选</button>
      <button id="btnDemo">加载示例词库</button>
      <button id="btnImport">导入客户词库</button>
      <input type="file" id="file" accept=".csv,.txt" style="display:none" />
      <label style="font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="useLlm" checked /> 用模型在候选里选（失败回退规则）
      </label>
      <span class="hint" id="hint"></span>
    </div>
  </section>

  <section class="card" id="out" style="display:none">
    <h2>② 建议</h2>
    <div class="warn" id="warn"></div>
    <div style="padding:0 14px 4px"><div class="selected" id="selected"></div></div>
    <div style="padding:0 14px 14px;margin-top:8px"><table id="candidates"></table></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

function render(d){
  const s = d.selected;
  $('#warn').textContent = d.warning || '';
  $('#selected').innerHTML = s
    ? `<b>${esc(s.code)} · ${esc(s.name)}</b><br/>${esc(d.explanation || '')}<br/>
       <span style="color:var(--muted);font-size:12px">置信度 ${(s.confidence*100).toFixed(0)}% · 引擎 ${esc(d.engine)}</span>`
    : `<span style="color:var(--muted)">没有候选：${esc(d.explanation || '')}</span>`;
  $('#candidates').innerHTML = (d.candidates||[]).length
    ? '<tr><th>编码</th><th>名称</th><th>命中关键词</th><th>置信度</th></tr>' +
      d.candidates.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td>
        <td>${(x.hits||[]).map(h=>`<span class="tag">${esc(h)}</span>`).join(' ') || '—'}</td>
        <td>${(x.confidence*100).toFixed(0)}%</td></tr>`).join('')
    : '<tr><td style="color:var(--muted)">没有候选</td></tr>';
  $('#out').style.display='block';
}

async function run(){
  const description = $('#desc').value.trim();
  if(!description){ toast('先写商品描述'); return; }
  $('#btnRun').disabled = true; $('#hint').textContent='查询中…';
  try{
    const r = await fetch('/api/customs/hs', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({description, use_llm: $('#useLlm').checked})});
    if(!r.ok){ toast('失败：' + (await r.text()).slice(0,100)); return; }
    render(await r.json());
  } finally { $('#btnRun').disabled=false; $('#hint').textContent=''; }
}

$('#btnRun').onclick = run;
$('#btnDemo').onclick = async () => {
  const d = await (await fetch('/api/customs/demo', {method:'POST'})).json();
  $('#desc').value = d.text;
  render(d.result);
  toast('已加载示例 HS 词库（代码需报关行确认）');
};

$('#btnImport').onclick = () => $('#file').click();
$('#file').onchange = async () => {
  const f = $('#file').files[0]; if(!f) return;
  const csv = await f.text();
  const r = await fetch('/api/customs/dict/import', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({csv})});
  if(!r.ok){ toast('导入失败：' + (await r.text()).slice(0,120)); return; }
  const d = await r.json();
  toast(`已导入 ${d.added} 条，词库共 ${d.items} 条`);
  $('#file').value='';
};
</script>
</body>
</html>
