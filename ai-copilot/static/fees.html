<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>智单 · 异常费用识别</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1b2430;--muted:#6b7684;--brand:#1f4e79;--err:#c53030;--ok:#2f855a;--warn:#9a5b00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  header a{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none}
  .wrap{padding:16px;max-width:1120px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);display:flex;gap:10px;align-items:center}
  .card h2 .sp{margin-left:auto;font-weight:400;font-size:11.5px}
  textarea{width:100%;min-height:220px;border:0;padding:14px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
           outline:none;resize:vertical;background:#fcfcfd}
  .bar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  button{font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .hint{color:var(--muted);font-size:12px;margin-left:auto}
  .kpi{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px}
  .kpi div{background:#fafbfc;border:1px solid var(--line);border-radius:9px;padding:8px 16px;min-width:110px}
  .kpi b{display:block;font-size:19px}
  .kpi span{font-size:11.5px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);background:#fafbfc;font-weight:600;white-space:nowrap}
  .tag{padding:1px 7px;border-radius:999px;font-size:11px;white-space:nowrap}
  .tag.error{background:#fde8e8;color:var(--err)}
  .tag.warn{background:#fdf1dc;color:var(--warn)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .empty{padding:26px;color:var(--muted);text-align:center;font-size:13px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;
         padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:80vw}
  .toast.show{opacity:1}
  .tip{font-size:12px;color:var(--muted);padding:0 14px 12px}
</style>
<link rel="stylesheet" href="/static/nav.css?v=20261108j" />
<script src="/static/nav.js?v=20261108j" defer></script>
</head>
<body class="app-shell">
<header>
  <h1>异常费用识别</h1>
  <span class="sub">重复收费 · 算术不符 · 未知费用 · 同批离群</span>
</header>


<div class="wrap">
  <section class="card">
    <h2>粘贴费用明细 <span class="sp">需要表头：单号 / 费用名称 / 金额（可选 数量、单价、车队、日期）</span></h2>
    <textarea id="input">运单号,费用名称,数量,单价,金额,车队
HY-001,运费,1,2600,2600,宏运车队
HY-001,提箱费,1,300,300,宏运车队
HY-001,运费,1,2600,2600,宏运车队
HY-002,运费,1,2800,2900,宏运车队
HY-003,燃油附加费,1,200,200,宏运车队
HY-004,运费,1,2500,2500,宏运车队
HY-005,运费,1,2550,2550,宏运车队
HY-006,运费,1,9000,9000,宏运车队</textarea>
    <div class="bar">
      <button class="primary" id="btnCheck">识别异常</button>
      <button id="btnClear">清空</button>
      <span class="hint" id="hint">纯本地规则，不上传外部</span>
    </div>
  </section>

  <section class="card" id="resultCard" style="display:none">
    <h2>识别结果</h2>
    <div class="kpi" id="kpi"></div>
    <div style="padding:0 0 12px"><table id="list"></table></div>
    <div class="tip" id="note"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const j = (u,o) => fetch(u,o).then(async r => {
  const t = await r.text();
  let d = null; try { d = JSON.parse(t); } catch(e) {}
  if(!r.ok) throw new Error((d && (d.detail || d.message)) || t.slice(0,160) || ('HTTP ' + r.status));
  return d;
});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('#btnCheck').onclick = async () => {
  const text = $('#input').value.trim();
  if(!text){ toast('先粘贴费用明细'); return; }
  const btn = $('#btnCheck'); btn.disabled = true; btn.textContent = '识别中…';
  try{
    const r = await j('/api/fees/check', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})});
    render(r);
  }catch(e){ toast(e.message); }
  finally{ btn.disabled = false; btn.textContent = '识别异常'; }
};

$('#btnClear').onclick = () => {
  $('#input').value = '';
  $('#resultCard').style.display = 'none';
};

function render(r){
  $('#resultCard').style.display = 'block';
  const errs = r.issues.filter(x => x.level === 'error').length;
  const warns = r.issues.filter(x => x.level === 'warn').length;
  $('#kpi').innerHTML = `
    <div><b>${r.rows}</b><span>费用行</span></div>
    <div><b>${r.total_amount}</b><span>合计金额</span></div>
    <div><b style="color:${errs?'var(--err)':'var(--ok)'}">${errs}</b><span>必须处理</span></div>
    <div><b style="color:${warns?'var(--warn)':'var(--ok)'}">${warns}</b><span>需核对</span></div>`;
  $('#note').textContent = r.note || '';
  if(!r.issues.length){
    $('#list').innerHTML = '<tr><td class="empty">未发现结构异常。仍需与合同价逐项核对。</td></tr>';
    return;
  }
  $('#list').innerHTML = `
    <tr><th>级别</th><th>行</th><th>单号</th><th>费用</th><th>金额</th><th>说明</th></tr>
    ${r.issues.map(x => `<tr>
      <td><span class="tag ${esc(x.level)}">${x.level === 'error' ? '必须处理' : '核对'}</span></td>
      <td class="mono">${x.row + 1}</td>
      <td class="mono">${esc(x.booking_no || '—')}</td>
      <td>${esc(x.fee_name || '—')}</td>
      <td class="mono">${esc(x.amount || '—')}</td>
      <td>${esc(x.message)}</td>
    </tr>`).join('')}`;
}
</script>
</body>
</html>
