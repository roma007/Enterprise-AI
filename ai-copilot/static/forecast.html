<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>智单 · 预测信用</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1b2430;--muted:#6b7684;--brand:#1f4e79;--err:#c53030;--ok:#2f855a;--warn:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  .wrap{padding:16px;max-width:1180px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
  .bar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  button{font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}
  .kpi div{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:10px}
  .kpi b{display:block;font-size:19px}
  .kpi span{font-size:11px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12.6px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);background:#fafbfc;font-weight:600;white-space:nowrap}
  .tag{padding:2px 9px;border-radius:999px;font-size:11.5px}
  .r-高{background:#fde8e8;color:var(--err)}
  .r-中{background:#fdf3e2;color:var(--warn)}
  .r-低{background:#e6f4ea;color:var(--ok)}
  .warn{background:#fff8e8;border:1px solid #f1dcae;color:#7a5200;padding:9px 12px;border-radius:8px;font-size:12.5px;margin:0 14px 12px}
  .cash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 14px 14px}
  .cash div{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafbfc}
  .cash b{display:block;font-size:17px}
  .cash span{font-size:11px;color:var(--muted)}
  .bar2{height:6px;background:#eef1f4;border-radius:3px;overflow:hidden;margin-top:5px}
  .bar2 i{display:block;height:100%;background:var(--brand)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  @media(max-width:900px){.kpi,.cash{grid-template-columns:1fr 1fr}}
</style>
<link rel="stylesheet" href="/static/nav.css?v=20261108h" />
<script src="/static/nav.js?v=20261108h" defer></script>
</head>
<body class="app-shell">
<header>
  <h1>预测信用</h1>
  <span class="sub">24 个月合成历史 → 回款/客户信用/线路趋势（演示，不是生产级预测）</span>
</header>

<div class="wrap">
  <section class="card">
    <h2>① 演示数据</h2>
    <div class="bar">
      <button class="primary" id="btnRun">重新计算</button>
      <span class="hint" id="hint">20 客户 × 24 个月；规则/简单统计</span>
    </div>
  </section>

  <section class="card" id="out" style="display:none">
    <h2>② 总览</h2>
    <div class="warn" id="warn"></div>
    <div class="kpi" id="kpi"></div>
    <h2 style="border-top:1px solid var(--line)">未来 4 周预计回款</h2>
    <div class="cash" id="cash"></div>
  </section>

  <section class="card" id="custCard" style="display:none">
    <h2>③ 客户信用（按风险排序）</h2>
    <div style="padding:0 14px 14px"><table id="customers"></table></div>
  </section>

  <section class="card" id="routeCard" style="display:none">
    <h2>④ 线路趋势 / 未来 3 个月</h2>
    <div style="padding:0 14px 14px"><table id="routes"></table></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

function render(d){
  $('#warn').textContent = d.warning;
  $('#kpi').innerHTML = `
    <div><b>${d.summary.customers}</b><span>客户</span></div>
    <div><b>${d.summary.high_risk}</b><span>高风险客户</span></div>
    <div><b>${money(d.summary.total_outstanding)}</b><span>未收</span></div>
    <div><b>${d.summary.months}</b><span>历史月数</span></div>`;
  $('#cash').innerHTML = d.cash.map(x=>`<div><b>${money(x.amount)}</b><span>${esc(x.week)}</span></div>`).join('');
  $('#customers').innerHTML = '<tr><th>客户</th><th>平均回款天数</th><th>逾期率</th><th>未收</th><th>风险分</th><th>等级</th><th>建议</th></tr>' +
    d.customers.slice(0,12).map(x=>`<tr><td>${esc(x.customer)}</td><td>${x.avg_paid_days}</td>
      <td>${(x.overdue_rate*100).toFixed(1)}%</td><td>${money(x.outstanding)}</td>
      <td>${x.risk_score}</td><td><span class="tag r-${esc(x.risk_level)}">${esc(x.risk_level)}</span></td>
      <td style="color:var(--muted)">${esc(x.suggestion)}</td></tr>`).join('');
  $('#routes').innerHTML = '<tr><th>线路</th><th>近 6 月收入</th><th>趋势</th><th>未来 3 个月</th></tr>' +
    d.routes.map(x=>{
      const last = x.revenue[x.revenue.length-1] || 1;
      return `<tr><td>${esc(x.route)}</td>
        <td>${money(last)}<div class="bar2"><i style="width:${Math.min(100,last/3000)}%"></i></div></td>
        <td style="color:${x.trend==='上升'?'var(--ok)':x.trend==='下降'?'var(--err)':'var(--muted)'}">${esc(x.trend)}</td>
        <td>${x.forecast.map(v=>money(v)).join(' / ')}</td></tr>`;
    }).join('');
  ['out','custCard','routeCard'].forEach(id=>$('#'+id).style.display='block');
}

async function run(){
  $('#btnRun').disabled = true; $('#hint').textContent='计算中…';
  try{
    const d = await (await fetch('/api/forecast/demo')).json();
    render(d);
  } finally { $('#btnRun').disabled=false; $('#hint').textContent='20 客户 × 24 个月；规则/简单统计'; }
}
$('#btnRun').onclick = run;
run();
</script>
</body>
</html>
