<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>托书录入 · 移动端</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1b2430;--muted:#6b7684;
        --brand:#1f4e79;--ok:#2f855a;--warn:#b7791f;--err:#c53030}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
       padding-bottom:80px}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;
         position:sticky;top:0;z-index:9}
  header h1{font-size:15px;margin:0;font-weight:600}
  header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .wrap{padding:14px}
  textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;
           padding:12px;font:14px/1.6 inherit;outline:none;background:#fff}
  textarea:focus{border-color:var(--brand)}
  .actions{display:flex;gap:8px;margin-top:10px}
  button{flex:1;font:inherit;font-size:15px;padding:12px;border-radius:10px;
         border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button:disabled{opacity:.5}
  label.up{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
           border:1px dashed var(--brand);color:var(--brand);border-radius:10px;padding:12px;
           font-size:15px;background:#f7fbff}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        margin-top:14px;overflow:hidden}
  .level{padding:12px 14px;font-weight:600;font-size:14px}
  .lv-auto{background:#e6f4ea;color:var(--ok)}
  .lv-single{background:#e8f0fb;color:var(--brand)}
  .lv-double{background:#fdf3e2;color:var(--warn)}
  .lv-blocked{background:#fde8e8;color:var(--err)}
  .row{display:flex;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid #f0f2f5}
  .row .k{width:88px;flex:0 0 88px;font-size:12.5px;color:var(--muted)}
  .row input{flex:1;border:0;border-bottom:1px solid transparent;padding:4px 0;font:inherit;
             font-size:14px;outline:none;background:transparent}
  .row input:focus{border-bottom-color:var(--brand)}
  .row .p{width:40px;text-align:right;font-size:11px;color:var(--muted)}
  .hint{padding:10px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid #f0f2f5}
  .banner{margin:14px;padding:10px 12px;border-radius:8px;background:#fde8e8;
          border:1px solid #f5c2c2;color:var(--err);font-size:13px}
  .foot{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;background:var(--panel);
        border-top:1px solid var(--line);display:none;gap:10px}
  .foot.show{display:flex}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2430;
         color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;
         transition:.25s;pointer-events:none;max-width:86vw}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>托书录入</h1>
  <p>粘贴 / 拍照 → 自动出单 → 核对确认</p>
</header>

<div class="wrap">
  <textarea id="raw" placeholder="把客户发来的托书粘贴在这里，或直接拍照上传"></textarea>
  <div class="actions">
    <label class="up" id="upLabel" for="file">拍照 / 上传</label>
    <input id="file" type="file" accept="image/*,.pdf,.txt,.csv" hidden />
    <button class="primary" id="btnParse">解析</button>
  </div>
  <div id="out"></div>
</div>

<div class="foot" id="foot">
  <button id="btnConfirm" class="primary">确认入库</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let LAST = null, T0 = 0, META = null;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}

async function boot(){
  META = await (await fetch('/api/meta')).json();
  if(!META.ocr_ready){ $('#upLabel').style.opacity=.45; }
}

async function upload(f){
  if(!f) return;
  const fd = new FormData(); fd.append('file', f); fd.append('use_llm', 'true');
  $('#upLabel').textContent = '识别中…';
  try{
    const r = await fetch('/api/extract/upload', {method:'POST', body:fd});
    if(!r.ok){ toast('识别失败：' + (await r.text()).slice(0,60)); return; }
    const d = await r.json();
    if(d.raw_text) $('#raw').value = d.raw_text;
    render(d);
  } finally { $('#upLabel').textContent = '拍照 / 上传'; $('#file').value=''; }
}

async function parse(){
  const text = $('#raw').value.trim();
  if(!text){ toast('请先粘贴或上传托书'); return; }
  $('#btnParse').disabled = true; $('#btnParse').textContent='解析中…';
  try{
    // 入口唯一化：先落 inbound，再解析。绕过率靠这一步成立。
    await fetch('/api/inbound', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, source:'h5'})});
    const r = await fetch('/api/extract', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, use_llm:true})});
    render(await r.json());
  } finally { $('#btnParse').disabled=false; $('#btnParse').textContent='解析'; }
}

const LEVEL = {
  auto:'✅ 自动通过 · 可直接归档',
  single:'🟡 需单人确认',
  double:'🟠 需双人复核',
  blocked:'🔴 有阻断问题，必须先改'
};

function render(d){
  LAST = d; T0 = Date.now();
  const rows = META.fields.filter(f => (d.fields[f.key]||{}).value).map(f=>{
    const v = d.fields[f.key];
    return `<div class="row">
      <span class="k">${f.label}</span>
      <input data-key="${f.key}" value="${(v.value||'').replace(/"/g,'&quot;')}" />
      <span class="p">${Math.round((v.confidence||0)*100)}%</span>
    </div>`;
  }).join('');

  const hard = d.checks.filter(c=>c.level==='error');
  $('#out').innerHTML = `
    <div class="card">
      <div class="level lv-${d.review_level}">${LEVEL[d.review_level]||d.review_level}</div>
      ${hard.length?`<div class="banner">${hard[0].message}</div>`:''}
      ${rows || '<div class="hint">没有识别到字段，请检查内容</div>'}
      <div class="hint">${d.elapsed_ms} ms · ${d.engine}${d.note?' · '+d.note:''}</div>
    </div>`;
  $('#foot').classList.add('show');
  $('#btnConfirm').textContent = d.review_level==='blocked' ? '强行确认（留痕）' : '确认入库';
}

async function confirmIt(){
  if(!LAST) return;
  const auto={}, final={};
  document.querySelectorAll('#out input').forEach(i=>{
    auto[i.dataset.key] = (LAST.fields[i.dataset.key]||{}).value || '';
    final[i.dataset.key] = i.value.trim();
  });
  const r = await fetch('/api/confirm', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({run_id:LAST.run_id, auto, final,
      handle_ms: T0 ? Math.max(0, Date.now()-T0) : null})});
  const j = await r.json();
  toast(`已入库 · 修正 ${j.changed} 项 · ${((Date.now()-T0)/1000).toFixed(0)} 秒`);
  $('#foot').classList.remove('show');
  $('#out').innerHTML = `<div class="card"><div class="level lv-auto">已入库</div>
    <div class="hint">单号 ${j.run_id} · 级别 ${j.review_level}</div></div>`;
  LAST=null;
}

$('#btnParse').onclick = parse;
$('#file').onchange = e => upload(e.target.files[0]);
$('#btnConfirm').onclick = confirmIt;
boot();
</script>
</body>
</html>
