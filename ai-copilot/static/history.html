<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>智单 · 确认历史与撤销</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1b2430;--muted:#6b7684;--brand:#1f4e79;--err:#c53030;--ok:#2f855a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center}
  header h1{font-size:15px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  header a{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none}
  .wrap{padding:16px;max-width:1080px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);background:#fafbfc;font-weight:600;white-space:nowrap}
  tr.run:hover{background:#fafbfc}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .tag{padding:2px 7px;border-radius:999px;font-size:11.5px;background:#eef2f7;white-space:nowrap}
  .tag.auto{background:#e6f4ea;color:#1e7b45}
  .tag.double{background:#fdf1dc;color:#9a5b00}
  .tag.blocked{background:#fde8e8;color:var(--err)}
  .preview{color:var(--muted);font-size:12px;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.danger{border-color:#f0c2c2;color:var(--err)}
  button.danger:hover{background:#fde8e8}
  .rev{background:#fafbfc}
  .rev table{font-size:12px}
  .rev td{padding:6px 10px;border-bottom:1px solid #eef1f4}
  .muted{color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;
         padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:80vw}
  .toast.show{opacity:1}
  .empty{padding:24px;color:var(--muted);text-align:center;font-size:13px}
  .chg{color:var(--err)}
  .new{color:var(--ok)}
</style>
<link rel="stylesheet" href="/static/nav.css" />
<script src="/static/nav.js" defer></script>
</head>
<body class="app-shell">
<header>
  <h1>确认历史与撤销</h1>
  <span class="sub">撤销不会删除历史，会追加一条修订流水</span>
</header>


<div class="wrap">
  <section class="card">
    <h2>最近确认的单据</h2>
    <table id="list"></table>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const j = (u,o) => fetch(u,o).then(async r => {
  const t = await r.text();
  let d = null; try { d = JSON.parse(t); } catch(e) {}
  if(!r.ok) throw new Error((d && (d.detail || d.message)) || t.slice(0,140) || ('HTTP ' + r.status));
  return d;
});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LV = {auto:'自动通过', single:'单人复核', double:'双人复核', blocked:'拦截'};

let ME = null;

function revRows(items){
  if(!items.length) return '<div class="empty">还没有修订记录</div>';
  return `<table>
    <tr><th>时间</th><th>动作</th><th>操作者</th><th>版本</th><th>变更</th><th>说明</th></tr>
    ${items.map(x => {
      const before = x.before || {}, after = x.after || {};
      let diff = '';
      let kind = '确认';
      if(x.action === 'confirm'){
        const n = (after.feedback || []).length;
        diff = `确认，修正 ${n} 项`;
      } else if(x.action === 'undo'){
        const n = (before.feedback || []).length;
        diff = `撤销，恢复 ${n} 项`;
        kind = '撤销';
      } else if(x.action === 'label'){
        diff = `标注 ${Object.keys(after.gold || {}).length} 个字段`;
        kind = '标注';
      } else if(x.action === 'ignore'){
        diff = '跳过，不进训练集';
        kind = '跳过';
      }
      return `<tr>
        <td class="muted">${esc((x.ts||'').replace('T',' ').slice(0,19))}</td>
        <td>${x.action === 'undo'
              ? '<span class="chg">撤销</span>'
              : (x.action === 'confirm' ? '<span class="new">确认</span>' : esc(kind))}</td>
        <td>${esc(x.actor_name || x.actor_email || x.actor || '—')}</td>
        <td>${x.version ?? ''}</td>
        <td>${diff}</td>
        <td class="muted">${esc(x.note || '')}</td>
      </tr>`;
    }).join('')}
  </table>`;
}

async function load(){
  ME = await j('/api/me');
  const d = await j('/api/runs/confirmed?limit=100');
  if(!d.items.length){
    $('#list').innerHTML = '<tr><td class="empty">还没有已确认的单据。去工作台确认一张单，这里就会出现。</td></tr>';
    return;
  }
  $('#list').innerHTML = `
    <tr><th>时间</th><th>单号/预览</th><th>级别</th><th>确认人</th><th>版本</th><th>操作</th></tr>
    ${d.items.map(r => `
      <tr class="run" data-id="${esc(r.id)}">
        <td class="muted" style="white-space:nowrap">${esc((r.ts||'').replace('T',' ').slice(0,16))}</td>
        <td><div class="mono">${esc(r.id)}</div><div class="preview" title="${esc(r.preview||'')}">${esc(r.preview||'')}</div></td>
        <td><span class="tag ${esc(r.review_level||'')}">${esc(LV[r.review_level] || r.review_level || '')}</span></td>
        <td>${esc(r.actor_name || r.actor_email || r.confirmed_by || '—')}</td>
        <td>${r.version}</td>
        <td>
          <button class="detail" data-id="${esc(r.id)}">修订</button>
          ${ME.role === 'admin' ? `<button class="danger undo" data-id="${esc(r.id)}" data-version="${r.version}">撤销</button>` : ''}
        </td>
      </tr>
      <tr class="rev" id="rev-${esc(r.id)}" style="display:none"><td colspan="6"></td></tr>
    `).join('')}`;

  document.querySelectorAll('.detail').forEach(b => b.onclick = async () => {
    const id = b.dataset.id;
    const tr = document.getElementById('rev-' + id);
    if(tr.style.display !== 'none'){ tr.style.display = 'none'; return; }
    tr.style.display = '';
    tr.firstElementChild.innerHTML = '<div class="muted" style="padding:8px">加载中…</div>';
    try{
      const rv = await j('/api/runs/' + id + '/revisions');
      tr.firstElementChild.innerHTML = revRows(rv.items);
    }catch(e){
      tr.firstElementChild.innerHTML = '<div class="chg" style="padding:8px">' + esc(e.message) + '</div>';
    }
  });

  document.querySelectorAll('.undo').forEach(b => b.onclick = async () => {
    const id = b.dataset.id;
    const note = prompt('撤销原因（写入修订流水，便于事后解释）：', '确认错了');
    if(note === null) return;
    if(!confirm('撤销这张单的确认？\n\n会回到未确认，已修正的字段记录清空，金标回到待标注。\n历史修订记录不会删除。')) return;
    try{
      const r = await j('/api/runs/' + id + '/undo', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({note, version: Number(b.dataset.version)})
      });
      toast(`已撤销，版本 ${r.version}，恢复 ${r.restored_fields} 个字段`);
      load();
    }catch(e){ toast('撤销失败：' + e.message); }
  });
}

load().catch(e => {
  $('#list').innerHTML = '<tr><td class="empty" style="color:#c53030">' + esc(e.message) + '</td></tr>';
});
</script>
</body>
</html>
