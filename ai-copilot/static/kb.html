<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>智单 · 企业知识库</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1b2430;--muted:#6b7684;--brand:#1f4e79;--err:#c53030;--ok:#2f855a;--warn:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  .wrap{padding:16px;max-width:1240px;margin:0 auto}
  .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);display:flex;gap:8px;align-items:center}
  .body{padding:12px 14px}
  input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;color:var(--ink)}
  textarea{min-height:150px;resize:vertical;line-height:1.6}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{font:inherit;font-size:12.5px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.danger{color:var(--err);border-color:#f0c2c2}
  button:disabled{opacity:.55;cursor:not-allowed}
  .doc{padding:8px 0;border-bottom:1px solid #f0f2f5}
  .doc b{display:block;font-size:13px}
  .doc .meta{font-size:11.5px;color:var(--muted)}
  .tag{display:inline-block;padding:1px 7px;border-radius:999px;background:#eef2f7;font-size:10.5px;color:var(--muted);margin-right:4px}
  .answer{white-space:pre-wrap;font-size:13.5px;line-height:1.75;min-height:80px}
  .cite{border-left:3px solid #bfd7ea;background:#f8fbfe;padding:8px 10px;border-radius:4px;margin-top:8px;font-size:12.5px}
  .cite b{display:block;font-size:12px;color:var(--brand);margin-bottom:2px}
  .muted{color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:80vw}
  .toast.show{opacity:1}
  .empty{padding:18px;color:var(--muted);font-size:12.5px;text-align:center}
  @media(max-width:980px){.grid{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="/static/nav.css?v=20261108g" />
<script src="/static/nav.js?v=20261108g" defer></script>
</head>
<body class="app-shell">
<header>
  <h1>企业知识库</h1>
  <span class="sub">SOP / 合同价 / 报关口径 / 异常处理 → 可检索、可引用</span>
</header>

<div class="wrap">
  <div class="grid">
    <div>
      <section class="card">
        <h2>知识文档 <span class="muted" id="docCount"></span></h2>
        <div class="body">
          <div class="row" style="margin-bottom:10px">
            <button id="btnDemo">加载演示知识库</button>
            <button id="btnUpload">上传文档</button>
            <input type="file" id="file" accept=".txt,.md,.csv,.png,.jpg,.jpeg,.webp,.pdf" style="display:none" />
          </div>
          <div id="docs"></div>
        </div>
      </section>

      <section class="card">
        <h2>添加文档</h2>
        <div class="body">
          <input type="text" id="title" placeholder="标题，例如：客户对账 SOP" />
          <input type="text" id="tags" placeholder="标签，逗号分隔，例如：对账,应收" style="margin-top:8px" />
          <textarea id="content" placeholder="粘贴 SOP / 合同价 / 报关口径 / 异常处理…" style="margin-top:8px"></textarea>
          <div class="row" style="margin-top:8px">
            <button class="primary" id="btnAdd">保存文档</button>
            <span class="muted" style="font-size:12px">只用于检索和回答，不做训练</span>
          </div>
        </div>
      </section>
    </div>

    <div>
      <section class="card">
        <h2>问知识库</h2>
        <div class="body">
          <textarea id="question" placeholder="例如：截港提前怎么办？报关需要哪些资料？"></textarea>
          <div class="row" style="margin-top:8px">
            <button class="primary" id="btnAsk">提问</button>
            <label style="font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px">
              <input type="checkbox" id="useLlm" checked /> 用模型回答（无依据就说没有）
            </label>
            <span class="muted" id="askHint" style="font-size:12px"></span>
          </div>
        </div>
      </section>

      <section class="card" id="answerCard" style="display:none">
        <h2>回答 <span class="muted" id="engine"></span></h2>
        <div class="body">
          <div class="answer" id="answer"></div>
          <div id="cites"></div>
        </div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
const j = (u,o) => fetch(u,o).then(async r => {
  const t = await r.text(); let d = null; try { d = JSON.parse(t); } catch(_) {}
  if(!r.ok) throw new Error((d && (d.detail || d.message)) || t.slice(0,140));
  return d;
});

async function loadDocs(){
  const d = await j('/api/kb/docs');
  $('#docCount').textContent = `(${(d.items||[]).length})`;
  $('#docs').innerHTML = (d.items||[]).length
    ? d.items.map(x => `<div class="doc">
        <b>${esc(x.title)}</b>
        <div class="meta">${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
          ${x.chars} 字 · ${x.chunks} 段 · ${esc((x.created_at||'').replace('T',' ').slice(0,16))}</div>
        <button class="danger del" data-id="${esc(x.id)}" style="margin-top:4px">删除</button>
      </div>`).join('')
    : '<div class="empty">还没有文档。点「加载演示知识库」或添加一份。</div>';
  document.querySelectorAll('.del').forEach(b => b.onclick = async () => {
    if(!confirm('删除这份文档？')) return;
    await j('/api/kb/docs/' + b.dataset.id, {method:'DELETE'});
    toast('已删除'); loadDocs();
  });
}

$('#btnAdd').onclick = async () => {
  const title = $('#title').value.trim(), content = $('#content').value.trim();
  if(!title || !content){ toast('标题和内容都要填'); return; }
  try{
    await j('/api/kb/docs', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({title, text: content, tags: $('#tags').value})});
    $('#title').value=''; $('#tags').value=''; $('#content').value='';
    toast('已保存'); loadDocs();
  }catch(e){ toast('保存失败：'+e.message); }
};

$('#btnUpload').onclick = () => $('#file').click();
$('#file').onchange = async () => {
  const f = $('#file').files[0]; if(!f) return;
  const fd = new FormData(); fd.append('file', f);
  fd.append('title', $('#title').value.trim() || f.name);
  fd.append('tags', $('#tags').value);
  try{
    await j('/api/kb/docs/upload', {method:'POST', body:fd});
    $('#file').value=''; toast('已上传并入库'); loadDocs();
  }catch(e){ toast('上传失败：'+e.message); }
};

$('#btnDemo').onclick = async () => {
  const d = await j('/api/kb/demo', {method:'POST'});
  await loadDocs();
  if(d.questions?.length) $('#question').value = d.questions[0];
  toast(`演示知识库已加载（新增 ${d.added} 份）`);
};

$('#btnAsk').onclick = async () => {
  const question = $('#question').value.trim();
  if(!question){ toast('先写一个问题'); return; }
  $('#btnAsk').disabled = true; $('#askHint').textContent = '检索中…';
  try{
    const d = await j('/api/kb/ask', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question, use_llm: $('#useLlm').checked})});
    $('#answerCard').style.display='block';
    $('#answer').textContent = d.answer || '';
    $('#engine').textContent = d.engine ? `引擎：${d.engine}` : '';
    const cites = d.citations || [];
    $('#cites').innerHTML = cites.length ? cites.map(c => `<div class="cite">
        <b>[${c.index}] ${esc(c.title)}</b>${esc(c.text)}</div>`).join('')
      : '<div class="muted" style="font-size:12px;margin-top:8px">没有引用；知识库里没有找到依据。</div>';
  }catch(e){ toast('提问失败：'+e.message); }
  finally{ $('#btnAsk').disabled=false; $('#askHint').textContent=''; }
};

loadDocs();
</script>
</body>
</html>
