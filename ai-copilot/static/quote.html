<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>智单 · 报价助手</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1b2430;--muted:#6b7684;--brand:#1f4e79;--err:#c53030;--ok:#2f855a;--warn:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  .wrap{padding:16px;max-width:1180px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
  textarea{width:100%;min-height:110px;border:0;padding:12px;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none;resize:vertical;background:#fcfcfd;color:var(--ink)}
  .bar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  button{font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .hint{color:var(--muted);font-size:12px;margin-left:auto}
  .kpi{display:flex;gap:10px;padding:14px;flex-wrap:wrap}
  .kpi div{flex:1;min-width:110px;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:9px}
  .kpi b{display:block;font-size:18px}
  .kpi span{font-size:11px;color:var(--muted)}
  .body{padding:0 14px 14px}
  .explain{font-size:13.5px;line-height:1.8;white-space:pre-wrap;background:#f8fbfe;border-left:3px solid #bfd7ea;padding:10px 12px;border-radius:4px}
  .warn{background:#fff8e8;border:1px solid #f1dcae;color:#7a5200;padding:9px 12px;border-radius:8px;font-size:12.5px;margin:0 14px 12px}
  .risk{color:var(--warn);font-size:12.5px;margin:4px 0}
  table{width:100%;border-collapse:collapse;font-size:12.6px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);background:#fafbfc;font-weight:600;white-space:nowrap}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
<link rel="stylesheet" href="/static/nav.css?v=20261108h" />
<script src="/static/nav.js?v=20261108h" defer></script>
</head>
<body class="app-shell">
<header>
  <h1>报价助手</h1>
  <span class="sub">询价 → 历史价/成本 → 建议报价 + 风险（数字由规则算，模型只解释）</span>
</header>

<div class="wrap">
  <section class="card">
    <h2>① 客户询价</h2>
    <textarea id="text" placeholder="例如：北滘到盐田，40HQ，2 个柜，家电，周五要装"></textarea>
    <div class="bar">
      <button class="primary" id="btnRun">生成报价建议</button>
      <button id="btnDemo">加载演示询价</button>
      <label style="font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="useLlm" checked /> 用模型补全/解释（失败回退规则）
      </label>
      <span class="hint" id="hint"></span>
    </div>
  </section>

  <section class="card" id="out" style="display:none">
    <h2>② 报价建议</h2>
    <div class="kpi" id="kpi"></div>
    <div class="warn" id="warn"></div>
    <div class="body">
      <div class="explain" id="explain"></div>
      <div id="risks" style="margin-top:8px"></div>
    </div>
  </section>

  <section class="card" id="samples" style="display:none">
    <h2>③ 历史样本（合成演示）</h2>
    <div class="body"><table id="sampleTable"></table></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => Number(n || 0).toLocaleString(undefined, {maximumFractionDigits: 0});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

function render(d){
  const q = d.inquiry, s = d.stats, p = d.pricing;
  $('#kpi').innerHTML = `
    <div><b>${esc(q.route || '—')}</b><span>线路</span></div>
    <div><b>${esc(q.container_type || '—')} × ${q.qty}</b><span>箱型/数量</span></div>
    <div><b>${s.count}</b><span>历史样本</span></div>
    <div><b>${money(p.cost)}</b><span>成本中位</span></div>
    <div><b style="color:var(--brand)">${money(p.recommended)}</b><span>建议报价</span></div>
    <div><b>${(p.margin_at_recommended*100).toFixed(1)}%</b><span>建议毛利率</span></div>
    <div><b>${money(p.floor)}</b><span>成本底线</span></div>`;
  $('#warn').textContent = d.warning || '';
  $('#explain').textContent = d.explanation || '';
  $('#risks').innerHTML = (d.risks||[]).map(x=>`<div class="risk">⚠ ${esc(x)}</div>`).join('') || '<div class="muted" style="font-size:12.5px">未发现明显风险。</div>';
  $('#sampleTable').innerHTML = '<tr><th>日期</th><th>线路</th><th>箱型</th><th>成本</th><th>报价</th><th>毛利率</th></tr>' +
    (d.samples||[]).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.route)}</td><td>${esc(x.container_type)}</td>
      <td>${money(x.cost)}</td><td>${money(x.quote)}</td><td>${((x.quote-x.cost)/x.quote*100).toFixed(1)}%</td></tr>`).join('');
  $('#out').style.display='block'; $('#samples').style.display='block';
}

async function run(){
  const text = $('#text').value.trim();
  if(!text){ toast('先写客户询价'); return; }
  $('#btnRun').disabled = true; $('#hint').textContent = '计算中…';
  try{
    const r = await fetch('/api/quote', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, use_llm: $('#useLlm').checked})});
    if(!r.ok){ toast('失败：' + (await r.text()).slice(0,120)); return; }
    render(await r.json());
  } finally { $('#btnRun').disabled = false; $('#hint').textContent = ''; }
}

$('#btnRun').onclick = run;
$('#btnDemo').onclick = async () => {
  const d = await (await fetch('/api/quote/demo')).json();
  $('#text').value = d.text;
  render(d.result);
  toast('已加载合成演示价格');
};
</script>
</body>
</html>
