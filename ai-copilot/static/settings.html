<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>阈值配置</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1b2430;--muted:#6b7684;--brand:#1f4e79;--ok:#2f855a;--err:#c53030}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center}
  header h1{font-size:15px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  header a{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none}
  .wrap{padding:16px;max-width:900px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
  .item{display:grid;grid-template-columns:1fr 130px;gap:12px;padding:12px 14px;border-bottom:1px solid #f0f2f5;align-items:center}
  .item:last-child{border-bottom:0}
  .item .lbl{font-size:13px;font-weight:600}
  .item .hint{font-size:11.5px;color:var(--muted);margin-top:2px}
  .item input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;text-align:right}
  .item input:focus{border-color:var(--brand);outline:none}
  .chg{color:var(--err);font-size:11px;margin-left:6px}
  .bar{display:flex;gap:10px;align-items:center;padding:14px}
  button{font:inherit;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .note{color:var(--muted);font-size:12px;margin-left:auto}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;
         padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>阈值配置</h1>
  <span class="sub">改完立即生效，不需要重启</span>
  <a href="/">← 返回工作台</a>
</header>

<div class="wrap" id="wrap"></div>

<div class="card">
  <div class="bar">
    <button class="primary" id="btnSave">保存</button>
    <button id="btnReset">恢复默认</button>
    <span class="note" id="note"></span>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let DATA = null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
const j = (u,o) => fetch(u,o).then(r => r.ok ? r.json() : r.text().then(t=>{ throw new Error(t.slice(0,140)); }));

async function load(){
  DATA = await j('/api/settings');
  $('#wrap').innerHTML = DATA.groups.map(g => `
    <section class="card">
      <h2>${g.name}</h2>
      ${g.items.map(it => `
        <div class="item">
          <div>
            <div class="lbl">${it.label}${it.changed?'<span class="chg">已修改</span>':''}</div>
            <div class="hint">${it.hint}　范围 ${it.min}–${it.max}</div>
          </div>
          <input type="number" step="${it.step}" min="${it.min}" max="${it.max}"
                 value="${it.value}" data-key="${it.key}" data-default="${it.default}" />
        </div>`).join('')}
    </section>`).join('');
  $('#note').textContent = DATA.updated_at
    ? `上次修改：${DATA.updated_at.replace('T',' ').slice(0,16)}`
    : '当前全部为默认值';
}

$('#btnSave').onclick = async () => {
  const values = {};
  document.querySelectorAll('input[data-key]').forEach(i => {
    const v = Number(i.value);
    if (Math.abs(v - Number(i.dataset.default)) > 1e-9) values[i.dataset.key] = v;
    else values[i.dataset.key] = v;
  });
  try{
    await j('/api/settings', {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({values})});
    toast('已保存，立即生效');
    load();
  }catch(e){ toast('保存失败：' + e.message); }
};

$('#btnReset').onclick = async () => {
  if(!confirm('恢复所有阈值到默认值？')) return;
  try{
    await j('/api/settings/reset', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    toast('已恢复默认');
    load();
  }catch(e){ toast('失败：' + e.message); }
};

load().catch(e => { $('#wrap').innerHTML = `<div class="card"><div style="padding:14px;color:#c53030">${e.message}</div></div>`; });
</script>
</body>
</html>
