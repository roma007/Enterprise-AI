<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>智单 · 系统配置</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1b2430;--muted:#6b7684;
        --brand:#1f4e79;--ok:#2f855a;--warn:#b7791f;--err:#c53030}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;
         display:flex;gap:12px;align-items:center}
  header h1{font-size:15px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  header .spacer{flex:1}
  header .badge{font-size:12px;padding:2px 8px;border-radius:999px;background:#eef2f7;
                border:1px solid var(--line);color:var(--muted)}
  header input{width:230px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;
               font:inherit;font-size:12.5px;outline:none}
  header input:focus{border-color:var(--brand)}
  button{font:inherit;font-size:13px;padding:7px 14px;border-radius:7px;border:1px solid var(--line);
         background:#fff;cursor:pointer;color:var(--ink)}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .cfg{display:grid;grid-template-columns:196px 1fr;gap:16px;padding:16px;
       max-width:1240px;margin:0 auto;align-items:start}
  .side{position:sticky;top:72px;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:8px;font-size:13px}
  .side a{display:block;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none}
  .side a:hover{background:#f3f6f9}
  .side a.on{background:#eef4fa;color:var(--brand);font-weight:600}
  .side .sep{height:1px;background:var(--line);margin:6px 4px}
  main{min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;
        scroll-margin-top:78px}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);
           color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
  .card h2 .tag{font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;
                background:#eef2f7;color:var(--muted)}
  .card .body{padding:6px 14px 12px}
  .cfg-item{display:grid;grid-template-columns:1fr 210px;gap:16px;padding:11px 0;
        border-bottom:1px solid #f0f2f5}
  .cfg-item:last-child{border-bottom:0}
  .cfg-item .lbl{font-size:13.5px;font-weight:600}
  .cfg-item .hint{font-size:12px;color:var(--muted);margin-top:2px}
  .cfg-item .chg{font-size:10.5px;color:var(--warn);border:1px solid #f3ddb8;background:#fff8ec;
             border-radius:999px;padding:0 6px;margin-left:6px}
  .cfg-item input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;
              font:inherit;font-size:13px;outline:none}
  .cfg-item input:focus{border-color:var(--brand)}
  .cfg-item .sub2{font-size:11px;color:var(--muted);margin-top:4px;text-align:right}
  .cfg-item input.switch{width:18px;height:18px;accent-color:var(--brand)}
  .cfg-item.wide{grid-template-columns:1fr}
  .cfg-item textarea{width:100%;min-width:320px;padding:7px 9px;border:1px solid var(--line);
    border-radius:7px;font:inherit;font-size:13px;line-height:1.5;resize:vertical;color:var(--ink)}
  .fieldpick{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:6px}
  .fieldpick label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink)}
  .fieldpick input{width:15px;height:15px;accent-color:var(--brand)}
  .env-tag{font-size:10.5px;color:#1f4e79;background:#eef4fa;border:1px solid #d7e6f5;
           border-radius:999px;padding:0 6px;margin-left:6px}
  .irow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
        border-bottom:1px solid #f0f2f5;font-size:13px}
  .irow:last-child{border-bottom:0}
  .irow span{color:var(--muted)}
  .irow b{font-weight:600;word-break:break-all;text-align:right}
  .irow b.miss{color:var(--err)}
  .testbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
  .testbar .res{font-size:12px;color:var(--muted)}
  .testbar .res.ok{color:var(--ok)}
  .testbar .res.err{color:var(--err)}
  .note{font-size:12px;color:var(--muted);padding:10px 14px;background:#fafbfc;
        border-top:1px solid var(--line)}
  .hitem{padding:10px 0;border-bottom:1px solid #f0f2f5}
  .hitem:last-child{border-bottom:0}
  .htop{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .htop b{color:var(--ink);font-size:12.5px}
  .htop .why{color:var(--warn)}
  .hchg{font-size:12.5px;margin:4px 0 6px}
  .hchg code{background:#f1f3f6;border-radius:4px;padding:1px 5px;font-size:12px}
  .hitem button{padding:4px 10px;font-size:12px}
  .empty{color:var(--muted);font-size:12.5px;padding:10px 0}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;
         padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:900px){
    .cfg{grid-template-columns:1fr}
    .side{position:static;display:flex;flex-wrap:wrap;gap:4px}
    .side a{padding:5px 9px}
    .side .sep{display:none}
    header input{width:150px}
  }
</style>
<link rel="stylesheet" href="/static/nav.css?v=20261108h" />
<script src="/static/nav.js?v=20261108h" defer></script>
</head>
<body class="app-shell">
<header>
  <h1>系统配置</h1>
  <span class="sub">运行级配置保存即生效；部署级只读</span>
  <span class="spacer"></span>
  <span class="badge" id="roleBadge" style="display:none"></span>
  <input id="reason" placeholder="变更原因（降低阈值时必填）" />
  <button class="primary" id="btnSave">保存</button>
  <button id="btnReset">恢复默认</button>
</header>

<div class="cfg">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let DATA = null;      // /api/settings
let INTEG = null;     // /api/config/integrations
let HIST = [];        // /api/settings/history
let ME = null;
let META = null;
let NOTIFY = {items: []};
let DIRTY = false;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function esc(s){return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function j(u,o){
  const r = await fetch(u,o);
  if(r.ok) return r.json();
  const t = await r.text();
  let m = t; try { m = JSON.parse(t).detail || t; } catch(e){}
  throw new Error(String(m).slice(0,180));
}
const fmt = s => (s||'').replace('T',' ').slice(0,16);

async function loadMe(){
  try { ME = await j('/api/me'); } catch(e){ return; }
  const admin = ME.role === 'admin';
  if(!admin){
    const badge = $('#roleBadge');
    badge.textContent = '只读账号 · ' + (ME.role_label || ME.role);
    badge.style.display = '';
    $('#reason').disabled = true; $('#btnSave').disabled = true; $('#btnReset').disabled = true;
    $('#btnSave').textContent = '只读账号';
  }
}

async function load(){
  [DATA, INTEG, HIST, META, NOTIFY] = await Promise.all([
    j('/api/settings'),
    j('/api/config/integrations'),
    j('/api/settings/history?limit=50').then(d => d.items || []),
    j('/api/meta'),
    j('/api/notify/recent?limit=8').catch(() => ({items: []})),
  ]);
  render();
}

function render(){
  const admin = !ME || ME.role === 'admin';
  const sections = [];

  // 概览
  const changed = DATA.groups.flatMap(g => g.items).filter(i => i.changed).length;
  sections.push(`<section class="card" id="sec-overview"><h2>概览</h2><div class="body">
    <div class="irow"><span>运行级配置</span><b>${DATA.groups.reduce((n,g)=>n+g.items.length,0)} 项</b></div>
    <div class="irow"><span>已修改（非默认）</span><b>${changed} 项</b></div>
    <div class="irow"><span>最后修改</span><b>${DATA.updated_at ? fmt(DATA.updated_at) : '尚未修改'}</b></div>
    <div class="irow"><span>部署级配置</span><b>来自 .env，改完需重启（见下方）</b></div>
  </div>
  <div class="testbar">
    <button type="button" id="btnExport">导出配置</button>
    <button type="button" id="btnImport">导入配置</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden />
    <span class="res">导出不含密钥；导入会覆盖同名项。</span>
  </div>
  <div class="note">默认值是演示口径，客户现场必须用真实工时和样本校准；降低自动通过阈值会要求填写原因。</div></section>`);

  // 阈值分组
  for(const g of DATA.groups){
    sections.push(`<section class="card" id="sec-${encodeURIComponent(g.name)}"><h2>${esc(g.name)}
      <span class="tag">即时生效</span></h2><div class="body">
      ${g.items.map(it => `
        <div class="cfg-item ${(it.type === 'list' || it.lines) ? 'wide' : ''}">
          <div>
            <div class="lbl">${esc(it.label)}${it.changed ? '<span class="chg">已修改</span>' : ''}
              ${it.env_set ? '<span class="env-tag">环境变量已设置，页面值优先</span>' : ''}</div>
            <div class="hint">${esc(it.hint)}</div>
          </div>
          <div>
            ${it.type === 'list' ? `
              <div class="fieldpick" data-list-key="${esc(it.key)}" data-old='${JSON.stringify(it.value)}'>
                ${(it.options || (META.fields || []).map(f => ({key: f.key, label: f.label}))).map(o => `<label><input type="checkbox" data-list="${esc(it.key)}"
                    value="${esc(o.key)}" ${it.value.includes(o.key) ? 'checked' : ''}
                    ${admin ? '' : 'disabled'} /> ${esc(o.label)}</label>`).join('')}
              </div>
              <div class="sub2">至少 1 项 · 即时生效</div>
            ` : it.type === 'text' ? `
              ${it.lines ? `<textarea rows="${it.lines}" data-key="${esc(it.key)}" data-old="${esc(it.value)}"
                     ${admin ? '' : 'disabled'}>${esc(it.value)}</textarea>`
                : `<input type="text" data-key="${esc(it.key)}" data-old="${esc(it.value)}"
                     value="${esc(it.value)}"
                     placeholder="${it.secret ? (it.configured ? '已配置，留空不修改' : '未配置') : ''}"
                     ${admin ? '' : 'disabled'} />`}
              <div class="sub2">${it.secret ? '密钥类，接口/导出不回显；留空表示不修改' : (it.lines ? '占位符按客户自动替换 · 即时生效' : '即时生效')}</div>
            ` : it.type === 'bool' ? `
              <input type="checkbox" class="switch" data-key="${esc(it.key)}"
                     data-old="${it.value ? 1 : 0}" ${it.value ? 'checked' : ''} ${admin ? '' : 'disabled'} />
              <div class="sub2">默认 ${it.default ? '开' : '关'} · 即时生效</div>
            ` : `
              <input type="number" step="${it.step}" min="${it.min}" max="${it.max}"
                     value="${it.value}" data-key="${esc(it.key)}" data-old="${it.value}"
                     data-default="${it.default}" ${admin ? '' : 'disabled'} />
              <div class="sub2">默认 ${it.default} · 范围 ${it.min}–${it.max}</div>
            `}
          </div>
        </div>`).join('')}
    </div>
    ${g.name === 'TMS 写回' ? `
      <div class="testbar">
        ${admin ? '<button data-test="TMS">测试连接</button>' : ''}
        <span class="res" id="res-TMS"></span>
      </div>
      <div class="note">发送一份固定契约的测试 JSON；不会建单，也不写发件箱。</div>` : ''}
    ${g.name === '通知与告警' ? `
      <div class="testbar">
        ${admin ? '<button data-test="通知">发送测试消息</button>' : ''}
        <span class="res" id="res-通知"></span>
      </div>
      <div class="note">最近通知：${(NOTIFY.items || []).length
        ? (NOTIFY.items).slice(0, 6).map(n => `<div>${fmt(n.ts)} · ${esc(n.label || n.event)} ·
            ${n.sent ? '已发送' : (n.error ? esc(n.error) : (n.quiet ? '静默未发' : '未发送'))}</div>`).join('')
        : '暂无记录'}</div>` : ''}
    </section>`);
  }

  // 集成（只读）
  for(const g of INTEG.groups){
    sections.push(`<section class="card" id="sec-int-${encodeURIComponent(g.name)}">
      <h2>${esc(g.name)}<span class="tag">来自 .env · 重启生效</span></h2>
      <div class="body">${g.items.map(it => `<div class="irow"><span>${esc(it.label)}</span>
        <b class="${it.configured === false ? 'miss' : ''}">${it.configured === false ? '未配置' : esc(it.value || '—')}</b></div>`).join('')}</div>
      <div class="testbar">
        ${admin ? `<button data-test="${esc(g.name)}">测试连接</button>` : ''}
        <span class="res" id="res-${esc(g.name)}"></span>
      </div></section>`);
  }

  // 变更历史
  sections.push(`<section class="card" id="sec-history"><h2>变更历史<span class="tag">最近 50 条</span></h2>
    <div class="body">${HIST.length ? HIST.map(h => `
      <div class="hitem">
        <div class="htop"><b>${esc(h.actor_name || h.actor || 'system')}</b><span>${fmt(h.ts)}</span>
          ${h.reason ? `<span class="why">${esc(h.reason)}</span>` : ''}</div>
        <div class="hchg">${(h.changes||[]).map(c => `${esc(c.label)}：<code>${c.old}</code> → <code>${c.new}</code>`).join('；')}</div>
        ${admin ? `<button data-rollback="${esc(h.id)}">回滚到这次之前</button>` : ''}
      </div>`).join('') : '<div class="empty">还没有变更记录</div>'}
    </div></section>`);

  $('#main').innerHTML = sections.join('');

  // 侧栏
  const side = [`<a href="#sec-overview" class="on">概览</a>`]
    .concat(DATA.groups.map(g => `<a href="#sec-${encodeURIComponent(g.name)}">${esc(g.name)}</a>`))
    .concat([`<div class="sep"></div>`])
    .concat(INTEG.groups.map(g => `<a href="#sec-int-${encodeURIComponent(g.name)}">${esc(g.name)}（只读）</a>`))
    .concat([`<div class="sep"></div>`, `<a href="#sec-history">变更历史</a>`]);
  $('#side').innerHTML = side.join('');

  bind();
}

function bind(){
  $$('#main input[data-key], #main textarea[data-key]').forEach(i => i.oninput = () => { DIRTY = true; });
  $$('#side a').forEach(a => a.onclick = () => {
    $$('#side a').forEach(x => x.classList.remove('on'));
    a.classList.add('on');
  });
  $$('#main button[data-test]').forEach(b => b.onclick = () => testConn(b.dataset.test, b));
  $$('#main button[data-rollback]').forEach(b => b.onclick = () => rollback(b.dataset.rollback, b));
  const ex = $('#btnExport'); if(ex) ex.onclick = exportCfg;
  const im = $('#btnImport'); if(im) im.onclick = () => $('#importFile').click();
  const fi = $('#importFile'); if(fi) fi.onchange = onImportFile;
}

// 降低风险阈值必须写原因
const DANGER = new Set(['booking.risk_auto_floor','booking.low_conf_floor',
                        'invoice.risk_auto_floor','invoice.low_conf_floor']);
function collect(){
  const values = {}, lowered = [];
  $$('#main input[data-key], #main textarea[data-key]').forEach(i => {
    const k = i.dataset.key, old = Number(i.dataset.old);
    if(i.type === 'text' || i.tagName === 'TEXTAREA'){
      if(i.value !== (i.dataset.old || '')) values[k] = i.value;
      return;
    }
    const v = i.type === 'checkbox' ? (i.checked ? 1 : 0) : Number(i.value);
    if(Math.abs(v - old) > 1e-9){
      values[k] = i.type === 'checkbox' ? !!i.checked : v;
      if(DANGER.has(k) && v < old) lowered.push(k);
      if(i.type === 'checkbox' && k.startsWith('rules.') && old === 1 && v === 0) lowered.push(k);
    }
  });
  $$('.fieldpick').forEach(box => {
    const k = box.dataset.listKey;
    const old = JSON.parse(box.dataset.old || '[]').slice().sort();
    const now = [...box.querySelectorAll('input[data-list]:checked')].map(i => i.value).sort();
    if(now.join(',') !== old.join(',')){
      values[k] = now;
      if(now.length < old.length) lowered.push(k);
    }
  });
  return {values, lowered};
}

async function exportCfg(){
  try{
    const d = await j('/api/settings/export');
    const blob = new Blob([JSON.stringify(d, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '智单-配置-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }catch(e){ toast('导出失败：' + e.message); }
}

async function onImportFile(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch(err){ toast('文件不是合法 JSON'); return; }
  const values = (data && data.values) || data;
  if(!values || typeof values !== 'object' || Array.isArray(values)){ toast('缺少 values 对象'); return; }
  if(!confirm(`导入 ${Object.keys(values).length} 项配置？同名项会被覆盖。`)) return;
  try{
    await j('/api/settings/import', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({values, reason:'导入配置文件'})});
    toast('已导入'); DIRTY = false; await load();
  }catch(err){ toast('导入失败：' + err.message); }
}

$('#btnSave').onclick = async () => {
  const {values, lowered} = collect();
  if(!Object.keys(values).length){ toast('没有改动'); return; }
  const reason = $('#reason').value.trim();
  if(lowered.length && !reason){ toast('降低阈值、关闭规则或减少必填字段，需要填写变更原因'); return; }
  $('#btnSave').disabled = true;
  try{
    await j('/api/settings', {method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({values, reason})});
    DIRTY = false; $('#reason').value = '';
    toast('已保存，立即生效');
    await load();
  }catch(e){ toast('保存失败：' + e.message); }
  finally { $('#btnSave').disabled = false; }
};

$('#btnReset').onclick = async () => {
  if(!confirm('恢复所有阈值到默认值？这会覆盖当前所有修改。')) return;
  const reason = $('#reason').value.trim() || '恢复默认';
  try{
    await j('/api/settings/reset', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({reason})});
    toast('已恢复默认'); DIRTY = false; await load();
  }catch(e){ toast('失败：' + e.message); }
};

async function rollback(id, btn){
  if(!confirm('回滚这次变更？当前值会改回变更前的值。')) return;
  btn.disabled = true;
  try{
    await j('/api/settings/rollback', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id, reason: $('#reason').value.trim() || '页面回滚'})});
    toast('已回滚'); await load();
  }catch(e){ toast('回滚失败：' + e.message); btn.disabled = false; }
}

async function testConn(name, btn){
  const res = $('#res-' + CSS.escape(name));
  const target = name === '模型' ? 'llm' : name === '企业微信' ? 'wecom'
               : name === '通知' ? 'notify' : name === 'TMS' ? 'tms'
               : name === '邮件（SMTP）' ? 'email' : 'storage';
  btn.disabled = true; if(res){ res.className = 'res'; res.textContent = '测试中…'; }
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 30000);
    const r = await fetch('/api/config/test/' + target, {method:'POST', signal: ctrl.signal}).then(async x => {
      const d = await x.json(); if(!x.ok) throw new Error(d.detail || ('HTTP ' + x.status)); return d;
    }).finally(() => clearTimeout(timer));
    if(res){
      res.className = 'res ' + (r.ok ? 'ok' : 'err');
      if(target === 'notify'){
        res.textContent = r.sent ? '测试消息已发送' : ('未发送：' + (r.error || r.skipped || '未知原因'));
        res.className = 'res ' + (r.sent ? 'ok' : 'err');
      } else if(target === 'tms'){
        res.textContent = r.ok
          ? `TMS 接收正常 · ${r.elapsed_ms} ms`
          : '失败：' + (r.error || r.status || '未知错误');
        res.className = 'res ' + (r.ok ? 'ok' : 'err');
      } else if(target === 'email'){
        res.textContent = r.ok ? '测试邮件已发送' : ('失败：' + (r.error || '未知错误'));
        res.className = 'res ' + (r.ok ? 'ok' : 'err');
      } else {
        res.textContent = r.ok
          ? `连接正常 · ${r.elapsed_ms} ms${r.model ? ' · ' + r.model : ''}${r.backend ? ' · ' + r.backend : ''}`
          : '失败：' + (r.error || '未知错误');
      }
    }
  }catch(e){
    if(res){ res.className = 'res err'; res.textContent = '失败：' + String(e.message || e); }
  }finally{ btn.disabled = false; }
}

window.addEventListener('beforeunload', e => {
  if(DIRTY){ e.preventDefault(); e.returnValue = ''; }
});

(async () => { await loadMe(); try { await load(); } catch(e){
  $('#main').innerHTML = `<div class="card"><div class="body" style="color:var(--err)">${esc(e.message)}</div></div>`;
}})();
</script>
</body>
</html>
