<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>智单 · 客户查询</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1b2430;--muted:#6b7684;--brand:#1f4e79;--err:#c53030;--ok:#2f855a;--warn:#b7791f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  .wrap{padding:16px;max-width:1080px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
  textarea{width:100%;min-height:90px;border:0;padding:12px;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none;resize:vertical;background:#fcfcfd;color:var(--ink)}
  .bar{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  button{font:inherit;font-size:13px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .hint{color:var(--muted);font-size:12px;margin-left:auto}
  .answer{font-size:14px;line-height:1.8;background:#f8fbfe;border-left:3px solid #bfd7ea;padding:10px 12px;border-radius:4px;white-space:pre-wrap}
  .facts{display:flex;gap:10px;flex-wrap:wrap;padding:0 14px 12px}
  .facts div{flex:1;min-width:120px;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:9px}
  .facts b{display:block;font-size:15px}
  .facts span{font-size:11px;color:var(--muted)}
  .warn{background:#fff8e8;border:1px solid #f1dcae;color:#7a5200;padding:9px 12px;border-radius:8px;font-size:12.5px;margin:0 14px 12px}
  table{width:100%;border-collapse:collapse;font-size:12.8px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);background:#fafbfc;font-weight:600;white-space:nowrap}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
<link rel="stylesheet" href="/static/nav.css?v=20261108l" />
<script src="/static/nav.js?v=20261108k" defer></script>
</head>
<body class="app-shell">
<header>
  <h1>客户查询</h1>
  <span class="sub">箱号 / 单号 / 客户 → 当前状态、ETA、报关、时间线（演示）</span>
</header>

<div class="wrap">
  <section class="card">
    <h2>① 客户问题</h2>
    <textarea id="q" placeholder="例如：这个箱 MSCU7654329 到哪了？几时到港？"></textarea>
    <div class="bar">
      <button class="primary" id="btnRun">查询</button>
      <button id="btnDemo">加载演示问题</button>
      <label style="font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="useLlm" checked /> 用 AI 改写回答（失败回退模板）
      </label>
      <span class="hint" id="hint"></span>
    </div>
  </section>

  <section class="card" id="out" style="display:none">
    <h2>② 回答</h2>
    <div class="warn" id="warn"></div>
    <div style="padding:0 14px 12px"><div class="answer" id="answer"></div></div>
    <div class="facts" id="facts"></div>
  </section>

  <section class="card" id="timelineCard" style="display:none">
    <h2>③ 时间线</h2>
    <div style="padding:0 14px 14px"><table id="timeline"></table></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

function render(d){
  $('#warn').textContent = d.warning || '';
  $('#answer').textContent = d.answer || '';
  const s = d.shipment;
  $('#facts').innerHTML = s ? `
    <div><b>${esc(s.container_no)}</b><span>箱号</span></div>
    <div><b>${esc(s.booking_no)}</b><span>单号</span></div>
    <div><b>${esc(s.route)}</b><span>线路</span></div>
    <div><b>${esc(s.status)}</b><span>当前状态</span></div>
    <div><b>${esc(s.eta)}</b><span>ETA</span></div>
    <div><b>${esc(s.customs_status)}</b><span>报关</span></div>
    <div><b>${s.delay_hours ? s.delay_hours + 'h' : '正常'}</b><span>延误</span></div>` : '';
  $('#timeline').innerHTML = '<tr><th>时间</th><th>事件</th><th>地点</th></tr>' +
    (d.timeline||[]).map(x=>`<tr><td>${esc(x.ts)}</td><td>${esc(x.event)}</td><td>${esc(x.place)}</td></tr>`).join('');
  $('#out').style.display='block'; $('#timelineCard').style.display='block';
}

async function run(){
  const question = $('#q').value.trim();
  if(!question){ toast('先写客户问题'); return; }
  $('#btnRun').disabled = true; $('#hint').textContent='查询中…';
  try{
    const r = await fetch('/api/track/query', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question, use_llm: $('#useLlm').checked})});
    if(!r.ok){ toast('查询失败：' + (await r.text()).slice(0,120)); return; }
    render(await r.json());
  } finally { $('#btnRun').disabled=false; $('#hint').textContent=''; }
}

$('#btnRun').onclick = run;
$('#btnDemo').onclick = async () => {
  const d = await (await fetch('/api/track/demo')).json();
  $('#q').value = d.query;
  render(d.result);
  toast('已加载演示在途数据');
};
</script>
</body>
</html>
