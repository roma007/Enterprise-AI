<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>智单 · 用户管理</title>
<style>
  :root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--ink:#1b2430;--muted:#6b7684;--brand:#1f4e79;--err:#c53030;--ok:#2f855a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center}
  header h1{font-size:15px;margin:0}
  header .sub{color:var(--muted);font-size:12px}
  header a{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:none}
  .wrap{padding:16px;max-width:1000px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
  .body{padding:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;outline:none}
  input:focus,select:focus{border-color:var(--brand)}
  button{font:inherit;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);background:#fafbfc;font-weight:600}
  .tag{padding:2px 8px;border-radius:999px;font-size:11.5px;background:#eef2f7}
  .tag.off{background:#fde8e8;color:var(--err)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;
         padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .hint{color:var(--muted);font-size:12px}
</style>
<link rel="stylesheet" href="/static/nav.css?v=20261108j" />
<script src="/static/nav.js?v=20261108j" defer></script>
</head>
<body class="app-shell">
<header>
  <h1>用户管理</h1>
  <span class="sub">仅管理员可见</span>
</header>


<div class="wrap">
  <section class="card">
    <h2>新建用户</h2>
    <div class="body">
      <div class="row">
        <input id="email" placeholder="邮箱，如 wang@corp.com" style="flex:1;min-width:200px" />
        <input id="name" placeholder="姓名" style="width:110px" />
        <select id="role">
          <option value="operator">单证员</option>
          <option value="finance">财务</option>
          <option value="viewer">只读</option>
          <option value="admin">管理员</option>
        </select>
        <input id="password" type="password" placeholder="初始密码（≥10 位，字母+数字）" style="width:240px" />
        <button class="primary" id="btnCreate">创建</button>
      </div>
      <div class="hint" style="margin-top:8px">密码由你设定后告知对方，对方登录后可自行修改。</div>
    </div>
  </section>

  <section class="card">
    <h2>现有用户</h2>
    <div style="padding:0 0 12px"><table id="list"></table></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const ROLE = {admin:'管理员', operator:'单证员', finance:'财务', viewer:'只读'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
const j = (u,o) => fetch(u,o).then(r => r.ok ? r.json() : r.text().then(t => { throw new Error(t.slice(0,120)); }));

async function load(){
  const d = await j('/api/users');
  $('#list').innerHTML = '<tr><th>邮箱</th><th>姓名</th><th>角色</th><th>状态</th><th>最近登录</th><th>操作</th></tr>' +
    d.items.map(u => `<tr>
      <td>${u.email}</td><td>${u.name || ''}</td>
      <td><select data-id="${u.id}" class="rl">
        ${Object.entries(ROLE).map(([k,v]) => `<option value="${k}" ${k===u.role?'selected':''}>${v}</option>`).join('')}
      </select></td>
      <td><span class="tag ${u.active?'':'off'}">${u.active?'启用':'停用'}</span></td>
      <td style="color:var(--muted);font-size:12px">${(u.last_login||'—').replace('T',' ').slice(0,16)}</td>
      <td><button data-id="${u.id}" data-active="${u.active}" class="tg">${u.active?'停用':'启用'}</button></td>
    </tr>`).join('');

  document.querySelectorAll('.rl').forEach(sel => sel.onchange = async () => {
    try{
      await j('/api/users/' + sel.dataset.id, {method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({role: sel.value})});
      toast('角色已更新');
      load();
    }catch(e){ toast('失败：' + e.message); load(); }
  });
  document.querySelectorAll('.tg').forEach(b => b.onclick = async () => {
    const next = b.dataset.active !== '1';
    try{
      await j('/api/users/' + b.dataset.id, {method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({active: next})});
      toast(next ? '已启用' : '已停用（该用户所有会话失效）');
      load();
    }catch(e){ toast('失败：' + e.message); }
  });
}

$('#btnCreate').onclick = async () => {
  const body = {
    email: $('#email').value.trim(),
    name: $('#name').value.trim(),
    role: $('#role').value,
    password: $('#password').value,
  };
  if(!body.email || !body.password){ toast('邮箱和密码必填'); return; }
  try{
    await j('/api/users', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    toast('用户已创建');
    $('#email').value=''; $('#name').value=''; $('#password').value='';
    load();
  }catch(e){ toast('失败：' + e.message); }
};

load().catch(e => { $('#list').innerHTML = `<tr><td style="color:#c53030">${e.message}</td></tr>`; });
</script>
</body>
</html>
