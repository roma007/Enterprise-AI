apiVersion: v1
kind: Namespace
metadata:
  name: ai-delivery
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-delivery-secrets
  namespace: ai-delivery
type: Opaque
stringData:
  DATABASE_URL: postgres://postgres:postgres@postgres.example:5432/ai_delivery
  AUTH_SECRET: replace-with-long-random-secret
  REDIS_URL: redis://redis.example:6379
  # 多主机必须使用 S3/MinIO，避免本地 PDF 缓存不一致
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio.example:9000
  S3_REGION: us-east-1
  S3_BUCKET: ai-delivery
  S3_PREFIX: ai-delivery
  S3_ACCESS_KEY_ID: replace-me
  S3_SECRET_ACCESS_KEY: replace-me
  S3_FORCE_PATH_STYLE: "true"
  METRICS_TOKEN: replace-me
  PAYMENT_PROVIDER: manual
  BILLING_WEBHOOK_SECRET: replace-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-delivery-backend
  namespace: ai-delivery
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: ai-delivery-backend }
  template:
    metadata:
      labels: { app: ai-delivery-backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/ai-delivery-backend:latest
          ports: [{ name: http, containerPort: 8788 }]
          envFrom:
            - secretRef: { name: ai-delivery-secrets }
          env:
            - { name: PORT, value: "8788" }
            - { name: HOST, value: "0.0.0.0" }
            - { name: AUTH_REQUIRED, value: "true" }
            - { name: APP_VERSION, value: "replace-with-image-tag" }
            - { name: PDF_WORKER_INLINE, value: "false" }
            - { name: TRUST_PROXY, value: "true" }
            - { name: PG_POOL_MAX, value: "20" }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ai-delivery
spec:
  selector: { app: ai-delivery-backend }
  ports:
    - { name: http, port: 8788, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-delivery-pdf-worker
  namespace: ai-delivery
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai-delivery-pdf-worker }
  template:
    metadata:
      labels: { app: ai-delivery-pdf-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/ai-delivery-backend:latest
          command: ["npm", "run", "worker:pdf"]
          envFrom:
            - secretRef: { name: ai-delivery-secrets }
          env:
            - { name: SKIP_MIGRATIONS, value: "true" }
            - { name: APP_VERSION, value: "replace-with-image-tag" }
            - { name: PDF_JOB_LEASE_MINUTES, value: "15" }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "2Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-delivery-frontend
  namespace: ai-delivery
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: ai-delivery-frontend }
  template:
    metadata:
      labels: { app: ai-delivery-frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/ai-delivery-frontend:latest
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ai-delivery
spec:
  selector: { app: ai-delivery-frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-delivery-backend-pdb
  namespace: ai-delivery
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ai-delivery-backend }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-delivery
  namespace: ai-delivery
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: ai-delivery.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-delivery-migrate
  namespace: ai-delivery
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/your-org/ai-delivery-backend:latest
          command: ["sh", "scripts/init-db.sh"]
          envFrom:
            - secretRef: { name: ai-delivery-secrets }
          env:
            - { name: SKIP_MIGRATIONS, value: "true" }
