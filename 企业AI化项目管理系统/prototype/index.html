<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 交付云 · 企业AI化项目管理系统</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
    --line:#e6e9ef; --brand:#4f46e5; --brand-soft:#eef2ff; --brand-2:#6366f1;
    --green:#059669; --green-soft:#ecfdf5;
    --amber:#d97706; --amber-soft:#fffbeb;
    --red:#dc2626; --red-soft:#fef2f2;
    --slate-soft:#f1f5f9;
    --r:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;}
  /* ---------- sidebar ---------- */
  .sidebar{
    width:232px; background:#0f172a; color:#cbd5e1; position:fixed; top:0; bottom:0; left:0;
    display:flex; flex-direction:column; padding:18px 12px; z-index:50;
  }
  .logo{display:flex; align-items:center; gap:10px; padding:4px 8px 18px;}
  .logo-mark{
    width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;
  }
  .logo-text{font-size:14px;font-weight:600;color:#f8fafc;letter-spacing:.2px;}
  .logo-sub{font-size:10px;color:#64748b;letter-spacing:.6px;text-transform:uppercase;}
  .nav-group{margin-top:14px;}
  .nav-title{font-size:10px;letter-spacing:.8px;color:#475569;padding:0 10px 6px;text-transform:uppercase;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
    color:#94a3b8;cursor:pointer;font-size:13px;transition:.15s;user-select:none;
  }
  .nav-item:hover{background:#1e293b;color:#e2e8f0;}
  .nav-item.active{background:#1e293b;color:#fff;box-shadow:inset 2px 0 0 var(--brand-2);}
  .nav-item svg{width:16px;height:16px;flex:none;opacity:.85;}
  .nav-badge{margin-left:auto;background:var(--brand);color:#fff;font-size:10px;border-radius:999px;padding:1px 6px;}
  .sidebar-foot{margin-top:auto;padding:10px;border-top:1px solid #1e293b;display:flex;gap:10px;align-items:center;}
  .avatar{width:30px;height:30px;border-radius:50%;background:#334155;color:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
  /* ---------- main ---------- */
  .main{margin-left:232px;flex:1;min-width:0;}
  .topbar{
    height:60px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:40;
  }
  .crumb{font-size:13px;color:var(--ink3);}
  .crumb b{color:var(--ink);font-weight:600;}
  .crumb span{margin:0 6px;}
  .spacer{flex:1;}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;
    font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;font-family:inherit;
  }
  .btn:hover{border-color:#cbd5e1;background:#fafafa;}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn-primary:hover{background:#4338ca;border-color:#4338ca;}
  .btn-sm{padding:4px 10px;font-size:12px;}
  .content{padding:26px 32px 60px;max-width:1240px;}
  h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.2px;}
  h2{font-size:16px;margin:0 0 12px;font-weight:650;}
  h3{font-size:13px;margin:0 0 8px;font-weight:650;color:var(--ink2);}
  .sub{color:var(--ink3);font-size:13px;margin:0 0 22px;}
  /* ---------- cards ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;}
  .card + .card{margin-top:16px;}
  .grid{display:grid;gap:16px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:1fr 1fr;}
  .stat-label{font-size:12px;color:var(--ink3);margin-bottom:6px;}
  .stat-value{font-size:26px;font-weight:650;letter-spacing:-.5px;line-height:1.1;}
  .stat-note{font-size:11px;color:var(--ink3);margin-top:6px;}
  /* ---------- badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap;}
  .b-green{background:var(--green-soft);color:var(--green);}
  .b-amber{background:var(--amber-soft);color:var(--amber);}
  .b-red{background:var(--red-soft);color:var(--red);}
  .b-brand{background:var(--brand-soft);color:var(--brand);}
  .b-gray{background:var(--slate-soft);color:#64748b;}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  /* ---------- table ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;color:var(--ink3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);letter-spacing:.3px;text-transform:uppercase;}
  td{padding:11px 10px;border-bottom:1px solid #f1f3f7;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafbfd;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  /* ---------- stage timeline ---------- */
  .timeline{display:flex;align-items:center;gap:0;margin:22px 0 6px;}
  .tl-item{flex:1;text-align:center;position:relative;}
  .tl-line{position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--line);z-index:0;}
  .tl-item:last-child .tl-line{display:none;}
  .tl-dot{
    width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--line);
    margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
    color:var(--ink3);position:relative;z-index:1;
  }
  .tl-item.done .tl-dot{background:var(--green);border-color:var(--green);color:#fff;}
  .tl-item.done .tl-line{background:var(--green);}
  .tl-item.current .tl-dot{background:#fff;border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 5px var(--brand-soft);}
  .tl-item.current .tl-line{background:linear-gradient(90deg,var(--brand),var(--line));}
  .tl-label{font-size:12px;color:var(--ink2);font-weight:600;}
  .tl-item.current .tl-label{color:var(--brand);}
  .tl-sub{font-size:10px;color:var(--ink3);}
  /* ---------- checklist ---------- */
  .ck{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px dashed #eef1f6;}
  .ck:last-child{border-bottom:none;}
  .ck-box{width:18px;height:18px;border-radius:5px;border:1.5px solid #cbd5e1;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;}
  .ck-box.ok{background:var(--green);border-color:var(--green);color:#fff;font-size:11px;}
  .ck-box.no{background:var(--red-soft);border-color:#fca5a5;}
  .ck-text{font-size:13px;}
  .ck-note{font-size:11px;color:var(--ink3);margin-top:2px;}
  /* ---------- matrix ---------- */
  .matrix-wrap{position:relative;padding:26px 20px 46px 62px;}
  .matrix{position:relative;height:420px;border-left:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;}
  .plot{
    position:absolute;inset:36px;
    background:
      linear-gradient(to right, #f1f5f9 1px, transparent 1px) 0 0/25% 100%,
      linear-gradient(to top, #f1f5f9 1px, transparent 1px) 0 0/100% 25%;
  }
  .bubble{
    position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:#fff;cursor:pointer;transition:.18s;transform:translate(-50%,50%);
    box-shadow:0 2px 8px rgba(15,23,42,.18);border:2px solid rgba(255,255,255,.9);
  }
  .bubble:hover{transform:translate(-50%,50%) scale(1.15);z-index:9;}
  .bubble.p{background:#4f46e5;}
  .bubble.c{background:#0ea5e9;}
  .bubble.w{background:#94a3b8;}
  .axis-y{position:absolute;left:12px;top:26px;bottom:46px;display:flex;align-items:center;}
  .axis-y span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--ink3);letter-spacing:2px;}
  .axis-x{position:absolute;bottom:20px;left:62px;right:20px;text-align:center;font-size:11px;color:var(--ink3);letter-spacing:2px;}
  .tick-y{position:absolute;left:-22px;font-size:10px;color:var(--ink3);transform:translateY(50%);}
  .tick-x{position:absolute;bottom:-20px;font-size:10px;color:var(--ink3);transform:translateX(-50%);}
  .legend{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--ink2);}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;}
  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .tab{padding:9px 16px;font-size:13px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;}
  /* ---------- misc ---------- */
  .pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:6px;background:var(--slate-soft);color:#475569;}
  .kv{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed #eef1f6;}
  .kv:last-child{border-bottom:none;}
  .kv span:first-child{color:var(--ink3);}
  .kv span:last-child{font-weight:600;}
  .progress{height:6px;background:#eef1f6;border-radius:999px;overflow:hidden;}
  .progress > i{display:block;height:100%;background:var(--brand);border-radius:999px;}
  .proj-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:.15s;
  }
  .proj-card:hover{border-color:#c7d2fe;box-shadow:0 6px 20px rgba(79,70,229,.08);transform:translateY(-1px);}
  .proj-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .proj-name{font-weight:650;font-size:14px;}
  .proj-meta{font-size:12px;color:var(--ink3);margin-bottom:14px;}
  .proj-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--ink2);}
  .quote{border-left:3px solid var(--brand-2);background:#fafbff;padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;color:var(--ink2);margin:10px 0;}
  .transcript{font-size:13px;line-height:1.9;color:#334155;max-height:410px;overflow:auto;padding-right:8px;}
  .transcript p{margin:0 0 10px;}
  .speaker{color:var(--brand);font-weight:600;}
  .list-item{padding:12px 14px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:.15s;}
  .list-item:hover{background:#fafbfd;}
  .list-item.active{background:var(--brand-soft);border-color:#c7d2fe;}
  .li-title{font-size:13px;font-weight:600;}
  .li-sub{font-size:11px;color:var(--ink3);margin-top:2px;}
  .hyp{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed #eef1f6;}
  .hyp:last-child{border-bottom:none;}
  .hyp-status{cursor:pointer;flex:none;}
  .empty{text-align:center;color:var(--ink3);padding:40px 0;font-size:13px;}
  .warn-bar{background:var(--amber-soft);border:1px solid #fde68a;color:#92400e;padding:10px 14px;border-radius:9px;font-size:12.5px;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;}
  .link{color:var(--brand);cursor:pointer;font-size:12px;}
  .link:hover{text-decoration:underline;}
  .roi-input{width:96px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;font-family:inherit;text-align:right;}
  .roi-input:focus{outline:none;border-color:var(--brand);}
  @media(max-width:1100px){
    .g4{grid-template-columns:repeat(2,1fr);}
    .g2{grid-template-columns:1fr;}
  }
  .proto-note{
    margin:10px 14px 0;
    padding:7px 9px;
    border:1px solid #334155;
    border-radius:7px;
    font-size:10.5px;
    line-height:1.45;
    color:#94a3b8;
    background:#0f172a;
  }
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const score = o => +(o.v * o.f * o.u).toFixed(1);
const band = o => { const s = score(o); return s >= 20 ? 'priority' : s >= 12 ? 'candidate' : 'parked'; };
const bandLabel = b => ({priority:'优先', candidate:'候选', parked:'搁置'}[b]);
const bandClass = b => ({priority:'b-brand', candidate:'b-gray', parked:'b-gray'}[b]);
const healthDot = h => ({green:'var(--green)', amber:'var(--amber)', red:'var(--red)'}[h]);
const attLabel = a => ({champion:'拥护', supporter:'支持', neutral:'中立', skeptic:'疑虑', blocker:'抵触'}[a]);
const attClass = a => ({champion:'b-green', supporter:'b-green', neutral:'b-gray', skeptic:'b-amber', blocker:'b-red'}[a]);
const roleLabel = r => ({decision_maker:'决策人', project_owner:'项目负责人', business_owner:'业务负责人', it_data:'IT/数据', frontline:'一线'}[r]);

function viewProject() {
  const p = DB.project;
  const tl = p.stages.map(s => {
    const idx = p.stages.findIndex(x => x.k === s.k);
    const cur = p.stages.findIndex(x => x.k === p.stage);
    const cls = idx < cur ? 'done' : idx === cur ? 'current' : '';
    return `<div class="tl-item ${cls}">
      <div class="tl-line"></div>
      <div class="tl-dot">${idx < cur ? '✓' : idx + 1}</div>
      <div class="tl-label">${s.n}</div>
      <div class="tl-sub">${s.d}</div>
    </div>`;
  }).join('');

  const gates = DB.gates.map(g => `

      <div class="ck-box ${g.ok ? 'ok' : 'no'}">${g.ok ? '✓' : ''}</div>
      <div>
        <div class="ck-text">${g.item}</div>
        <div class="ck-note">${g.note}</div>
      </div>

  const todos = DB.todos.map(t => `

function viewOpportunities() {

    return `<div class="bubble ${b === 'priority' ? 'p' : b === 'candidate' ? 'c' : 'w'}"
      style="left:${left}%;bottom:${bottom}%;width:${size}px;height:${size}px"

  }).join('');

  const ticksY = [1,2,3,4,5].map(n => `<div class="tick-y" style="bottom:${(n-1)/4*100}%">${n}</div>`).join('');
  const ticksX = [1,2,3,4,5].map(n => `<div class="tick-x" style="left:${(n-1)/4*100}%">${n}</div>`).join('');

  const rows = DB.opps.map(o => {

  }).join('');

  return `
    <h1>机会地图</h1>
    <p class="sub">6 个机会点 · 评分公式 P = 价值 × 可行性 × 紧迫性</p>

    <div class="card">

        <h3 style="margin:0">价值 × 可行性</h3>

      <div class="matrix-wrap">
        <div class="axis-y"><span>价 值 →</span></div>
        <div class="matrix">
          <div class="plot">
            ${ticksY}${ticksX}${bubbles}
          </div>
        </div>
        <div class="axis-x">可 行 性 →</div>
      </div>
      <div style="font-size:11px;color:var(--ink3);text-align:center;margin-top:4px">气泡大小 = 中性年化收益</div>
    </div>

    <div class="card">
      <h3>明细</h3>
      <table>
        <thead><tr><th>编号</th><th>机会点</th><th>V</th><th>F</th><th>U</th><th>P</th><th>档位</th><th>数据状态</th></tr></thead>

function viewOppDetail() {
  const o = DB.opps.find(x => x.code === OPP) || DB.opps[0];
  const b = band(o);
  const hyps = o.hypotheses.map((h, i) => {
    const cls = h.st === 'validated' ? 'b-green' : h.st === 'refuted' ? 'b-red' : 'b-amber';
    const lbl = h.st === 'validated' ? '已验证' : h.st === 'refuted' ? '已推翻' : '未验证';
    return `<div class="hyp">
      <span class="badge ${cls} hyp-status" data-hyp="${i}">${lbl}</span>
      <div>
        <div style="font-size:13px">${h.s}</div>
        <div style="font-size:11px;color:var(--ink3);margin-top:2px">${({value:'价值假设',feasibility:'可行性',adoption:'采纳',data:'数据'})[h.t]}</div>
      </div>
    </div>`;
  }).join('');

  const painTags = o.pains.map(p => {
    const pp = DB.pains.find(x => x.code === p);
    return `<span class="pill" style="margin:0 4px 6px 0" title="${pp ? pp.desc : ''}">${p}</span>`;
  }).join('');

  const payback = o.roi.neu > 0 ? (o.roi.cost / (o.roi.neu / 12)).toFixed(1) : '—';

  return `
    <div style="margin-bottom:6px"><span class="link" data-view="opportunities">← 返回机会地图</span></div>
    <h1>${o.title}</h1>
    <p class="sub">

      <span class="badge b-gray">${o.stage}</span>

    <div class="grid" style="grid-template-columns:1.1fr 1.2fr 1fr;align-items:start">
      <div class="card">
        <h3>评分</h3>
        <div class="kv"><span>价值 V</span><span>${o.v} / 5</span></div>
        <div class="kv"><span>可行性 F</span><span>${o.f} / 5</span></div>
        <div class="kv"><span>紧迫性 U</span><span>${o.u}</span></div>
        <div class="kv"><span>优先级 P</span><span style="color:var(--brand)">${score(o)}</span></div>
        <div class="kv"><span>数据就绪度 D</span><span>${o.d} / 5</span></div>
        <div style="margin-top:12px;font-size:12px;color:var(--ink2);background:#fafbfd;padding:10px;border-radius:8px;line-height:1.7">
          <b>评分理由：</b>${o.rationale}
        </div>
        <div style="margin-top:12px">
          <div style="font-size:11px;color:var(--ink3);margin-bottom:6px">关联痛点</div>
          ${painTags}
        </div>
      </div>

      <div class="card">
        <div class="section-head">
          <h3 style="margin:0">价值假设（${o.hypotheses.length}）</h3>
          <span class="link">+ 新增</span>
        </div>
        ${hyps}
        <div style="margin-top:12px;font-size:11px;color:var(--ink3)">
          点击状态标签可切换：未验证 → 已验证 / 已推翻
        </div>
        <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
          <h3>基线</h3>
          <div class="kv"><span>${o.baseline.metric}</span><span>${o.baseline.value}</span></div>
          <div class="kv"><span>数据来源</span><span style="font-weight:400;font-size:12px;color:var(--ink2)">${o.baseline.source}</span></div>
          <div class="kv"><span>置信度</span><span><span class="badge ${o.baseline.conf === 'high' ? 'b-green' : o.baseline.conf === 'medium' ? 'b-amber' : 'b-red'}">${o.baseline.conf}</span></span></div>
        </div>

          <div class="kv"><span>保守</span><span class="num">${o.roi.cons} 万/年</span></div>

}

/* ============================================================
   渲染与路由
   ============================================================ */
const VIEWS = {
  dashboard: viewDashboard,
  project: viewProject,
  stakeholders: viewStakeholders,
  interviews: viewInterviews,
  inventory: viewInventory,
  opportunities: viewOpportunities,
  opp: viewOppDetail,
  deliverables: viewDeliverables
};

const TITLES = {
  dashboard:'项目总览', project:'项目详情', stakeholders:'干系人',
  interviews:'访谈与痛点', inventory:'四维盘点', opportunities:'机会地图',
  opp:'机会点详情', deliverables:'交付物中心'
};

function render() {
  $('#view').innerHTML = VIEWS[VIEW]();
  $('#crumb-view').textContent = TITLES[VIEW];
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.view === VIEW);
  });
  window.scrollTo(0, 0);
  bind();
}

function go(v) { VIEW = v; render(); }

function bind() {
  document.querySelectorAll('.nav-item').forEach(n => {
    n.onclick = () => go(n.dataset.view);
  });
  document.querySelectorAll('[data-view]').forEach(n => {
    if (!n.classList.contains('nav-item')) n.onclick = () => go(n.dataset.view);
  });
  document.querySelectorAll('[data-opp]').forEach(n => {
    n.onclick = () => { OPP = n.dataset.opp; go('opp'); };
  });
  document.querySelectorAll('[data-project]').forEach(n => {
    n.onclick = () => go('project');
  });
  document.querySelectorAll('[data-tab]').forEach(n => {
    n.onclick = () => { INV_TAB = n.dataset.tab; render(); };
  });
  document.querySelectorAll('[data-hyp]').forEach(n => {
    n.onclick = () => {
      const o = DB.opps.find(x => x.code === OPP);
      const h = o.hypotheses[+n.dataset.hyp];
      h.st = h.st === 'unverified' ? 'validated' : h.st === 'validated' ? 'refuted' : 'unverified';
      render();
    };
  });
  const neu = document.getElementById('roi-neu');
  const cost = document.getElementById('roi-cost');
  if (neu && cost) {
    const upd = () => {
      const n = +neu.value || 0, c = +cost.value || 0;
      const out = document.getElementById('roi-out');
      out.textContent = n > 0 ? (c / (n / 12)).toFixed(1) + ' 个月' : '—';
    };
    neu.oninput = upd; cost.oninput = upd;
  }
}

render();
</script>
</body>
</html>
