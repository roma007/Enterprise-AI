<script type="text/markdown" id="md">"# Enterprise AI 实施全景图\n\n> **版本**：v1.4 ｜ **更新**：2026-11-07 ｜ **基线**：`74132b5`（GitHub Actions run #129 四 job 全绿）\n>\n> **定位**：本文件是实施过程的**单一事实源**。脑图看全局，流程图看顺序，检查表看证据。\n>\n> **HTML 版**：`实施全景图.html` 由 `scripts/build_impl_map.py` 从本文件生成，**不要手改 HTML**。HTML 会把 `[x]` / `[ ]` 渲染成复选框，并支持“只看未完成 / 只看已完成”。\n>\n> **GitHub/Gitee 阅读**：表格里的 `[x]` / `[ ]` 可能显示为普通文本，以 HTML 版的复选框为准。\n>\n> **适用**：诊断平台（`backend` + `frontend`）、AI 托书交付（`ai-copilot`）、多租户与 HA、客户试点、发布运维。\n\n---\n\n## 0. 铁律（摘要；权威与执行细节见 `AGENTS.md` §0）\n\n> **规则权威是 `AGENTS.md`**（Agent 每次会话自动加载）。本节只保留摘要；改规则先改 `AGENTS.md`，再同步本节，避免两处漂移。\n> **机械化**：`make preflight`；本地 `make install-hooks`；CI frontend job 运行同一脚本。\n\n1. **图先于改**：任何需求、缺陷、配置、文档变更，开工前先在本图定位受影响节点；提交前再复核一次。\n2. **同一提交更新**：代码、文档、状态、证据必须在同一次提交更新。只改代码不改图 = **未完成**。\n3. **完成只认证据**：`[x]` 必须有可复现命令、测试记录、CI run、截图/日志或客户签字；口头“应该没问题”不算。\n4. **外部项不冒充**：真实客户、真实支付、真实模型、真实 Alertmanager、真实 S3、K8s 预发未验证的，保持 `[ ]` / 🟡，不得写成已完成。\n5. **验证串行**：`verify:write` 与 e2e 不并行；合并前 CI 四个 job 全绿（backend / frontend / e2e / docker）。\n6. **不包装 AI**：规则引擎、OCR、脚本、人工复核不得写成“大模型能力”；合成样本必须标注“合成”。\n7. **无影响也要留痕**：判断本次改动不影响本图时，在提交说明写 `图无影响：<原因>`；否则更新对应节点与“最近核验”。\n8. **每次发布更新版本**：更新顶部日期/基线提交、受影响状态、`VERIFICATION.md` 对应章节。\n9. **HTML 不手改**：`实施全景图.html` 由 `make impl-map` 生成；CI 与 `make preflight` 会校验与 MD 同步，漂移即失败。\n\n> 违反以上任一条，视为变更未完成，**不得合并、不得推送**。\n\n---\n\n## 1. 图例与状态定义\n\n| 标识 | 含义 | 判定标准 |\n|---|---|---|\n| ✅ | 已完成且有证据 | 命令通过 / CI 绿 / 有验收记录 |\n| 🟡 | 代码完成，外部未验证 | 需要真实客户、真实环境或第三方 |\n| ⬜ | 未开始 | 无实现或无证据 |\n| ⛔ | 阻塞 / 明确不做 | 依赖缺失或不在本期范围 |\n| 🔁 | 持续运行 | 每次发布 / 每周 / 每月执行 |\n| 🧍 | 人工确认点 | 必须有人复核或签字 |\n| 🤖 | 大模型参与 | 仅限明确标注节点；规则不算 |\n| ⚙️ | 规则 / 脚本 / 系统 | 不是 AI |\n\n**进度口径**：`✅` = 代码 + 本地证据；`🟡` = 代码可用但外部证据缺失；`⬜/⛔` = 不能对外承诺。\n\n---\n\n## 2. 总览脑图\n\n```mermaid\nmindmap\n  root((Enterprise AI 实施全景))\n    诊断平台 SaaS ✅\n      S1 调研诊断 ✅\n      S2 方案设计 ✅\n      S3 POC 验证 ✅\n      S4 交付实施 ✅\n      S5 运营价值 ✅\n      门禁 G1-G5 ✅\n      真实客户试点 🟡\n    多租户底座 🟡\n      注册 组织 角色 ✅\n      PostgreSQL RLS ✅\n      试用 配额 账单 🟡\n      Redis S3 队列 ✅\n      多副本 K8s 🟡\n      备份 PITR ✅\n      监控 告警 值班 🟡\n    AI 托书 ✅\n      企微文字 ✅\n      H5 网页 批量 ✅\n      OCR 规则 ✅\n      模型补空 🟡\n      分级审批 ✅\n      人工确认 ✅\n      学习队列 ✅\n      金标评测 🟡\n      回写平台 ✅\n      企微图片 🟡\n    客户试点 ⬜\n      授权 脱敏 ⬜\n      样本 基线 ⬜\n      POC 复核 ⬜\n      UAT 上线 ⬜\n      签收 价值 ⬜\n    工程发布 🟡\n      本地自检 ✅\n      串行验证 ✅\n      CI 四 job ✅\n      双远端推送 ✅\n      灰度 回滚 🟡\n      变更复核本图 🔁\n```\n\n---\n\n## 3. 阶段主线：从机会到续约\n\n```mermaid\nflowchart LR\n  A[客户机会] --> G1{{G1 诊断门禁}}\n  G1 --> S1[S1 调研诊断<br/>✅ 代码 / 🟡 真实客户]\n  S1 --> G2{{G2 方案门禁}}\n  G2 --> S2[S2 方案设计<br/>✅ 代码 / 🟡 真实客户]\n  S2 --> G3{{G3 POC 门禁}}\n  G3 --> S3[S3 POC 验证<br/>✅ 代码 / ⬜ 真实 POC]\n  S3 --> G4{{G4 上线门禁}}\n  G4 --> S4[S4 交付实施<br/>✅ 代码 / ⬜ 真实上线]\n  S4 --> G5{{G5 价值门禁}}\n  G5 --> S5[S5 运营与价值<br/>✅ 代码 / ⬜ 真实数据]\n  S5 --> N[续约 / 二期]\n\n  subgraph FOUND[横切能力]\n    R1[R1 生产化 ✅]\n    R2[R2 方案与多租户 ✅]\n    R3[R3 POC 闭环 ✅]\n    R4[R4 交付闭环 ✅]\n    R5[R5 运营闭环 ✅]\n    R6[R6 知识库与 AI 助手 ✅ / 真实模型 ⬜]\n  end\n\n  FOUND -.-> S1\n  FOUND -.-> S2\n  FOUND -.-> S3\n  FOUND -.-> S4\n  FOUND -.-> S5\n\n  classDef done fill:#d4f4dd,stroke:#2f855a,stroke-width:2px\n  classDef partial fill:#fff4e5,stroke:#b7791f,stroke-width:2px,stroke-dasharray:5 5\n  classDef todo fill:#f1f5f9,stroke:#94a3b8,stroke-width:2px,stroke-dasharray:3 3\n  class S1,S2,R1,R2,R3,R4,R5,R6 done\n  class S3,S4,S5,G1,G2,G3,G4,G5 partial\n  class N todo\n```\n\n**读图要点**\n\n- 五个阶段**代码侧**都已跑通，且各有独立门禁；但“真实客户证据”只有 `🟡/⬜`。\n- 门禁不是文档检查，是**系统内的自动校验 + 人工确认**；没有证据不能勾选。\n- 真实客户试点必须从 S2 的真实机会点开始，不能拿合成样例直接跳到 S4。\n\n---\n\n## 4. 角色协作泳道\n\n```mermaid\nflowchart LR\n  subgraph K[客户侧]\n    K1[决策人 🧍]\n    K2[业务 owner 🧍]\n    K3[一线单证 / 财务 🧍]\n    K4[IT / 安全 🧍]\n  end\n\n  subgraph V[我方交付团队]\n    V1[销售 / 顾问]\n    V2[项目经理 PM]\n    V3[实施 / 交付]\n    V4[运维 / 值班]\n    V5[标注 / 评测]\n  end\n\n  subgraph P[平台与系统]\n    P1[诊断平台<br/>S1-S5 + 门禁]\n    P2[ai-copilot<br/>托书结构化]\n    P3[监控 / 审计 / 回写]\n  end\n\n  K1 -->|授权 / 预算 / Go-No-Go| V1\n  K2 -->|范围 / 验收 / 协调| V2\n  K3 -->|样本 / 差异 / 试用| V3\n  K4 -->|环境 / 脱敏 / 安全| V3\n  V1 --> P1\n  V2 --> P1\n  V3 --> P2\n  V5 --> P2\n  P2 --> P3\n  P3 --> V4\n  V4 -->|告警 / 复盘| V2\n  P1 -->|报告 / 价值| K1\n\n  classDef cust fill:#e8f0fb,stroke:#1f4e79,stroke-width:2px\n  classDef vendor fill:#d4f4dd,stroke:#2f855a,stroke-width:2px\n  classDef sys fill:#f1f5f9,stroke:#64748b,stroke-width:2px\n  class K1,K2,K3,K4 cust\n  class V1,V2,V3,V4,V5 vendor\n  class P1,P2,P3 sys\n```\n\n**协作硬规则**\n\n- 客户侧必须有一个**总协调 owner**，负责找齐业务 owner、一线骨干、IT、安全四类人。\n- 我方 PM 对计划与验收负责；实施对配置与上线负责；运维对监控与回滚负责；标注/评测对金标质量负责。\n- 任何跨角色交接都必须有**书面输入/输出**（模板、确认单、会议纪要、系统记录），不能只在聊天里说。\n\n---\n\n## 5. 变更发布闭环（每次改动都走）\n\n```mermaid\nflowchart TB\n  A[需求 / 缺陷 / 配置调整] --> B{读本图<br/>定位影响节点}\n  B --> C[改代码 / 文档 / 配置]\n  C --> D[本地自检<br/>typecheck / 单测 / smoke]\n  D --> E{串行验证}\n  E -->|失败| C\n  E -->|通过| F[提交<br/>同步更新本图 / VERIFICATION]\n  F --> G[推送 GitHub + Gitee]\n  G --> H{CI 四 job}\n  H -->|红| C\n  H -->|绿| I[部署 / 灰度]\n  I --> J[监控 24-72h]\n  J -->|异常| K[回滚]\n  J -->|正常| L[更新状态 / 证据 / 版本]\n  K --> C\n\n  classDef done fill:#d4f4dd,stroke:#2f855a,stroke-width:2px\n  classDef gate fill:#fff4e5,stroke:#b7791f,stroke-width:2px\n  classDef todo fill:#f1f5f9,stroke:#94a3b8,stroke-width:2px,stroke-dasharray:3 3\n  class A,C,D,F,G done\n  class B,E,H gate\n  class I,J,K,L todo\n```\n\n**执行顺序（禁止并行）**\n\n1. 定位节点 → 2. 改代码 → 3. 自检 → 4. `verify` / `verify:write` → 5. e2e（单独跑） → 6. 更新图与证据 → 7. commit → 8. push 双远端 → 9. CI 四 job 全绿 → 10. 部署/灰度 → 11. 监控 → 12. 回滚预案待命。\n\n> `verify:write` 与 e2e 共用测试库/端口，**不能同时跑**；CI 的 e2e 失败会重试 1 次，本地复验不带重试，结果更严格。\n\n---\n\n## 6. AI 托书实施流程（ai-copilot）\n\n```mermaid\nflowchart TB\n  subgraph ENTRY[入口层]\n    E1[企业微信文字 ✅]\n    E2[企业微信图片 🟡 代码完成 / 真机待验]\n    E3[H5 拍照 / 上传 ✅]\n    E4[网站粘贴 / 上传 ✅]\n    E5[批量导入 PNG / PDF / TXT ✅]\n    E6[个人微信 ⛔]\n    E7[会话内容存档 ⛔]\n  end\n\n  subgraph ING[接入与留痕]\n    I1[record_inbound<br/>source 白名单 ✅]\n    I2[原件存储 local / S3 ✅]\n    I3[内容哈希幂等 ⚙️ ✅]\n  end\n\n  subgraph EXT[抽取]\n    X1[RapidOCR ⚙️ ✅]\n    X2[规则抽取 ⚙️ ✅]\n    X3[模型补空 fill_only 🤖 🟡]\n    X4[多版本 OCR 裁决 ⚙️ ✅]\n  end\n\n  subgraph VAL[校验]\n    V1[箱号校验位 ⚙️ ✅]\n    V2[地址校验 ⚙️ ✅]\n    V3[费用异常 ⚙️ ✅]\n    V4[截港 / 时间 ⚙️ ✅]\n    V5[多票 / 改单 ⚙️ ✅]\n  end\n\n  subgraph REV[人工分级]\n    R1[single / double / blocked ✅]\n    R2[人工确认 / 改单 🧍 ✅]\n    R3[修订流水 / 撤销 ✅]\n  end\n\n  subgraph MET[指标与学习]\n    M1[绕过率 / 自动通过率 / 修正率 ✅]\n    M2[节省工时 / 风险模拟 ✅]\n    M3[学习队列自动入队 ✅]\n    M4[金标标注 / JSONL 导出 ✅]\n    M5[调优集 / 留出集评测 🟡 合成样本]\n    M6[抽样审计 / 变更回归 🔁]\n  end\n\n  subgraph OUT[输出]\n    O1[TMS 写回 ⛔ 待客户接口]\n    O2[交付平台回写 ✅]\n    O3[审计 / 导出 ✅]\n  end\n\n  E1 --> I1\n  E3 --> I1\n  E4 --> I1\n  E5 --> I1\n  I1 --> I2 --> X1 --> X2 --> X3 --> X4\n  X4 --> V1\n  X4 --> V2\n  X4 --> V3\n  X4 --> V4\n  X4 --> V5\n  V1 --> R1\n  V2 --> R1\n  V3 --> R1\n  V4 --> R1\n  V5 --> R1\n  R1 --> R2 --> R3\n  R3 --> M1\n  R3 --> M2\n  R3 --> M3\n  M3 --> M4 --> M5 --> M6\n  M6 -.->|反哺规则 / 阈值| X2\n  R3 --> O2\n  R3 --> O3\n\n  E2 -->|media_id 下载 + 异步 OCR + 主动推送| I1\n  E6 -.->|无官方接口| ENTRY\n  E7 -.->|不接| ENTRY\n\n  classDef done fill:#d4f4dd,stroke:#2f855a,stroke-width:2px\n  classDef partial fill:#fff4e5,stroke:#b7791f,stroke-width:2px,stroke-dasharray:5 5\n  classDef blocked fill:#fde8e8,stroke:#c53030,stroke-width:2px\n  class E1,E3,E4,E5,I1,I2,I3,X1,X2,X4,V1,V2,V3,V4,V5,R1,R2,R3,M1,M2,M3,M4,O2,O3 done\n  class X3,M5,E2 partial\n  class E6,E7,O1 blocked\n```\n\n**AI 边界（必须能对外讲清）**\n\n- OCR、规则、校验、指标、回写都是**系统能力**，不是大模型。\n- 大模型只在 `fill_only`（只补空）介入；无配置或失败自动回退规则。\n- 金标标的是**原文写了什么**，不是业务上“应该是什么”；箱号校验失败也不改金标原值。\n- 金标评测不是“训练一次就关闭人工复核”的开关；仍需抽样审计、变更回归、新格式准入。\n- 企微自动处理文字与图片：文字同步解析；图片异步 OCR 后主动推送，需 `WECOM_SECRET` / `WECOM_AGENTID`。PDF、多张图、扫描件走 H5/批量导入；“会话内容存档”不做；个人微信无官方接口，不做。\n\n---\n\n## 7. 多租户与 HA 实施流程\n\n### 7.1 部署拓扑（当前实现）\n\n```mermaid\nflowchart LR\n  U[用户 / 客户] --> W[企业微信 / H5 / 浏览器]\n  W --> N[nginx / TLS 终止]\n  N --> F[frontend 静态资源]\n  N --> B1[backend 副本 1]\n  N --> B2[backend 副本 2]\n  B1 --> PG[(PostgreSQL + RLS)]\n  B2 --> PG\n  B1 --> R[(Redis)]\n  B2 --> R\n  B1 --> S[(S3 / MinIO)]\n  B2 --> S\n  B1 --> Q[PDF worker]\n  Q --> PG\n  Q --> S\n  C[ai-copilot FastAPI] --> CP[(SQLite / PostgreSQL)]\n  C --> CS[(local / S3 原件)]\n  C --> OCR[RapidOCR ⚙️]\n  C --> LLM[可选模型 🤖]\n  C -.->|签名 API 回写| B1\n\n  classDef done fill:#d4f4dd,stroke:#2f855a,stroke-width:2px\n  classDef partial fill:#fff4e5,stroke:#b7791f,stroke-width:2px,stroke-dasharray:5 5\n  class W,N,F,B1,B2,PG,R,S,Q,C,CP,CS,OCR done\n  class LLM partial\n```\n\n**环境矩阵**\n\n| 环境 | 用途 | 状态 | 命令 / 证据 |\n|---|---|---|---|\n| 本地 SQLite | 开发 / 演示 | ✅ | `ai-copilot` 默认 |\n| 本地 PostgreSQL | 多实例前验证 | ✅ | `DATABASE_URL` + 迁移脚本 |\n| Docker Compose 单机 | 演示 / 小规模 | ✅ | `docker compose up -d --build` |\n| 多副本 Compose + nginx | HA 演练 | ✅ | `docker-compose.yml` + `soak:replicas` |\n| K8s 清单 | 预发/生产模板 | 🟡 | `ops/k8s/` 有清单，未上真实集群 |\n| 客户内网离线包 | 私有化交付 | ⬜ | 未实现 |\n\n### 7.2 租户生命周期与运行底座\n\n```mermaid\nflowchart LR\n  A[供应商自助注册] --> B[组织 + 首管理员]\n  B --> C[org_slug 登录]\n  C --> D[请求级 org 上下文]\n  D --> E[PostgreSQL RLS]\n  E --> F[客户 / 项目 / 报告 / 知识库隔离]\n\n  B --> G[14 天试用]\n  G --> H[套餐 / 配额]\n  H --> I[账单 / 模拟支付 / HMAC 回调]\n  I --> J[订阅到期 / 暂停]\n  J --> K[平台管理员<br/>租户列表 / 暂停恢复 / 调整套餐]\n  K --> L[租户导出 / 删除]\n\n  subgraph INFRA[运行底座]\n    N1[Redis 限流 + 会话缓存 ✅]\n    N2[S3 / MinIO 对象存储 🟡]\n    N3[PDF 队列 SKIP LOCKED ✅]\n    N4[多副本 Compose + nginx ✅]\n    N5[K8s 清单 / PDB / 迁移 Job 🟡]\n    N6[备份 / 恢复 / PITR ✅]\n    N7[SLO / 告警 / 值班 🟡]\n    N8[滚动发布 / 回滚演练 ✅]\n  end\n\n  F --> INFRA\n  INFRA --> M[真实客户生产环境 ⬜]\n\n  classDef done fill:#d4f4dd,stroke:#2f855a,stroke-width:2px\n  classDef partial fill:#fff4e5,stroke:#b7791f,stroke-width:2px,stroke-dasharray:5 5\n  classDef todo fill:#f1f5f9,stroke:#94a3b8,stroke-width:2px,stroke-dasharray:3 3\n  class A,B,C,D,E,F,G,H,K,L,N1,N3,N4,N6,N8 done\n  class I,J,N2,N5,N7 partial\n  class M todo\n```\n\n**关键边界**\n\n- 诊断平台是**供应商多租户 SaaS**；ai-copilot 是**单租户客户交付系统**，两者不混为一个应用。\n- 多租户隔离靠 PostgreSQL RLS + 受限角色 + 请求级 `app.org_id`，不是只靠代码 `where org_id`。\n- 真实支付、发票、自动扣费、K8s 预发、Alertmanager 真实触发、真实 S3 都还没验证。\n\n---\n\n## 8. 客户试点实施流程\n\n```mermaid\nflowchart LR\n  P0[候选客户筛选] --> P1[约见 / 45 分钟会客]\n  P1 --> P2[评分卡 / 资料采集]\n  P2 --> P3[参数回填 / ROI 重算]\n  P3 --> P4[提案 / 试点启动包]\n  P4 --> P5{客户授权 / 脱敏 / 环境}\n  P5 -->|未就绪| PX[暂停 / 补条件]\n  P5 -->|就绪| P6[200 份脱敏样本 / 基线]\n  P6 --> P7[POC 2 周 / 差异复核]\n  P7 --> P8{Go / No-Go}\n  P8 -->|No-Go| PZ[Park / 复盘]\n  P8 -->|Go| P9[UAT / 上线检查 / 培训]\n  P9 --> P10[上线 / 24-72h 监控]\n  P10 --> P11[客户签收 / 价值报告]\n  P11 --> P12[续约 / 二期]\n\n  classDef done fill:#d4f4dd,stroke:#2f855a,stroke-width:2px\n  classDef partial fill:#fff4e5,stroke:#b7791f,stroke-width:2px,stroke-dasharray:5 5\n  classDef todo fill:#f1f5f9,stroke:#94a3b8,stroke-width:2px,stroke-dasharray:3 3\n  class P0,P1,P2,P3,P4 done\n  class P5,P8 partial\n  class P6,P7,P9,P10,P11,P12,PX,PZ todo\n```\n\n**客户侧四类人（缺一不可）**\n\n| 角色 | 找谁 | 投入 | 负责 |\n|---|---|---|---|\n| 业务 owner | 单证 / 财务主管 | 每周 30 分钟 | 拍板范围与验收、协调样本、主持复盘 |\n| 一线骨干 | 单证员 / 财务专员 | 首周 2 小时 + 试用 | 解释单据、确认差异、反馈误判 |\n| IT 接口人 | 客户 IT | 首周 2–3 小时 | 环境、账号、接口、网络与权限 |\n| 数据 / 安全 | 安全或法务 | 1 次评审 | 脱敏规则、数据边界与合规确认 |\n\n> 第 1 周最关键：样本和验收口径定不下来，后面都白跑；采购/商务不用现在进场。\n\n---\n\n## 9. 逐项检查表（实施团队照此推进）\n\n> 状态说明：`[x]` 有证据；`[ ]` 未完成或外部未验证。每项右侧写证据或命令，禁止空勾。\n\n### 9.1 诊断平台 S1–S5\n\n| ID | 检查项 | 状态 | 证据 / 验收 |\n|---|---|---|---|\n| S1-01 | 项目、客户、干系人、访谈记录 | [x] | 前端工作台 + 后端 API |\n| S1-02 | 痛点、四维盘点、业务流程、机会点与 ROI、风险与局限 | [x] | S1 页面与 API |\n| S1-03 | 报告、确认与签收、行业标杆、回收站、审计日志 | [x] | `confirmations` / 审计 API |\n| S1-04 | CSV / Excel 批量导入（整批校验、失败回滚） | [x] | 导入接口 + 前端 |\n| S1-05 | G1 诊断门禁（客户确认、标杆校准） | [x] | G1 校验规则 |\n| S1-06 | 一个真实客户走完 G1 | [ ] | 需真实客户确认记录 |\n| S2-01 | 8 张表：方案版本 / 组件 / 集成 / 工作量 / 验收 / 评审 / 报价 | [x] | 迁移 + API |\n| S2-02 | 方案工作台、报价页、方案/报价 Word 导出 | [x] | 前端 + 导出 |\n| S2-03 | 方案/报价版本对比、客户版脱敏导出 | [x] | 对比接口 + 脱敏 |\n| S2-04 | G2 十二项校验（覆盖 / 报价 / 验收 / 阻断 / 负责人 / 人天） | [x] | G2 校验 |\n| S2-05 | 6 份交付物：方案书 / 架构 / 集成清单 / PRD / 报价 / 验收标准 | [x] | 模板 + 导出 |\n| S2-06 | 一个 R | I | C |\n| 上线 / UAT | A | R | R | C | I | A | R | C | I |\n| 监控 / 告警 | I | I | I | C | I | C | C | R/A | I |\n| 金标 / 评测 | I | C | R | I | I | I | C | I | R/A |\n| 价值报告 / 续约 | A | R | C | I | R | C | C | I | I |\n\n**硬规则**\n\n- 每行只能有一个 `A`；没有 `A` 的活动不允许启动。\n- 客户侧 `A` 不落地时，项目只能停在“方案/样例”，不能进入“真实试点/上线”。\n- 标注/评测的 `A` 不能由写规则/提示词的人兼任，避免自己标自己。\n\n---\n\n## 11. 变更影响矩阵（提交前对照）\n\n| 改动类型 | 必须更新 | 必须跑 |\n|---|---|---|\n| API / 数据模型 | 本图 6/7 节、OpenAPI、`VERIFICATION.md` | `verify` + 迁移检查 |\n| 前端页面 / 交互 | 本图 3/6 节、e2e 用例 | `typecheck` + e2e |\n| 规则 / 阈值 | 本图 6 节、运维手册阈值表 | 规则单测 + smoke |\n| 模型 / 提示词 | 本图 6 节、评测集、合成标注 | `make eval` + 金标回归 |\n| 企微 / H5 / 批量入口 | 本图 6 节、试用指南 | 入口实测 + inbound 校验 |\n| 多租户 / RLS | 本图 7 节、迁移、隔离测试 | `verify:write` + RLS 破坏性测试 |\n| CI / 部署 / 运维 | 本图 5/7 节、`DEPLOY.md`、`OPERATIONS.md` | 对应演练脚本 |\n| 只改文档 | 若改变了状态/承诺，更新本图与证据 | 链接检查 |\n| 无影响 | 提交说明写 `图无影响：<原因>` | 至少跑 smoke |\n\n---\n\n## 12. 每次改动如何复核本图（5 分钟版）\n\n1. **定位**：在 §9 找到对应 ID（如 `AI-21`）；没有就新增一行。\n2. **判定**：是代码完成（✅）、外部未验证（🟡）、未开始（⬜）还是阻塞（⛔）。\n3. **改图**：更新节点文字、状态、证据列；必要时改 §3–§8 的 Mermaid 图。\n4. **同步**：更新 `VERIFICATION.md` 对应章节；涉及待办则更新 `TODO.md`。\n5. **验证**：按 §11 跑命令；确认没有并行跑 `verify:write` 与 e2e。\n6. **提交**：commit message 带节点 ID，例如 `feat(copilot): 学习队列筛选 [AI-21]`。\n7. **推送**：双远端；等 CI 四 job 全绿。\n8. **复盘**：发布后 24 小时内确认线上与图一致；不一致则回滚或补图。\n\n---\n\n## 13. 维护记录\n\n| 版本 | 日期 | 基线 | 变更 |\n|---|---|---|---|\n| v1.4 | 2026-11-07 | `74132b5` | 企微图片：media_id 下载、异步 OCR、主动推送、MsgId 幂等；自检 16/16 |\n| v1.3 | 2026-11-07 | `202549f` | 铁律可执行化：preflight 脚本、Git hooks、CI 校验；规则权威归位 `AGENTS.md` |\n| v1.2 | 2026-11-07 | `e87e65d` | 复核 v1.1 改动并推送；run #126 四 job 全绿 |\n| v1.1 | 2026-11-07 | `e4e2b96` | 新增 CI 同步校验；run #125 四 job 全绿；CI-11 关闭 |\n| v1.0 | 2026-11-07 | `c3b37ac` | 首版：脑图、阶段主线、角色泳道、发布闭环、AI 托书、多租户、客户试点、逐项检查表、RACI、铁律 |\n\n> 下次复核：**每次提交**；至少每周一次全量核对。发现图与代码/证据不一致，先修图再继续开发。\n"</script>

<script>
(function () {
  const STATS = {"done": 79, "todo": 32, "total": 111, "percent": 71.2, "partial": 26, "blocked": 7};

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function ensureLibs() {
    if (!window.marked) {
      await loadScript('https://cdn.jsdelivr.net/npm/marked@16/lib/marked.umd.js');
    }
    if (!window.mermaid) {
      await loadScript('https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.min.js');
    }
  }

  function buildToc(root) {
    const toc = document.getElementById('toc');
    const nodes = root.querySelectorAll('h2, h3');
    let i = 0;
    nodes.forEach((h) => {
      i += 1;
      if (!h.id) h.id = 'sec-' + i;
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = h.tagName === 'H3' ? 'lv3' : '';
      toc.appendChild(a);
    });
  }

  function markRows(root) {
    // 表格里的 `[x]` / `[ ]` 不是列表任务项，marked 不会渲染成复选框；
    // 这里把状态列转成真正的复选框，才能做“只看未完成/已完成”筛选。
    root.querySelectorAll('td').forEach((td) => {
      const t = (td.textContent || '').trim();
      if (t === '[x]' || t === '[X]') {
        td.innerHTML = '<input type="checkbox" checked disabled aria-label="已完成">';
      } else if (t === '[ ]') {
        td.innerHTML = '<input type="checkbox" disabled aria-label="未完成">';
      }
    });

    root.querySelectorAll('table').forEach((table) => {
      if (table.querySelector('input[type=checkbox]')) table.classList.add('checklist');
    });
    root.querySelectorAll('tr').forEach((tr) => {
      if (tr.querySelector('th')) tr.classList.add('header-row');
      const cb = tr.querySelector('input[type=checkbox]');
      if (!cb) return;
      tr.classList.add(cb.checked ? 'done-row' : 'todo-row');
      if (/⛔/.test(tr.textContent || '')) tr.classList.add('blocked-row');
    });
    root.querySelectorAll('li').forEach((li) => {
      const cb = li.querySelector('input[type=checkbox]');
      if (!cb) return;
      li.classList.add(cb.checked ? 'done-row' : 'todo-row');
    });
  }

  function applyFilter(mode) {
    const content = document.getElementById('content');
    content.classList.remove('only-todo', 'only-done');
    if (mode === 'only-todo') content.classList.add('only-todo');
    if (mode === 'only-done') content.classList.add('only-done');
    document.querySelectorAll('.toolbar button[data-filter]').forEach((b) => {
      b.classList.toggle('on', b.dataset.filter === mode);
    });
  }

  async function init() {
    try {
      await ensureLibs();
    } catch (e) {
      document.getElementById('content').innerHTML =
        '<p class="error">缺少 marked / mermaid，且 CDN 加载失败。请在有网络时打开，或在仓库根目录安装前端依赖后重试。</p>';
      return;
    }

    marked.setOptions({ gfm: true, breaks: false });
    const md = JSON.parse(document.getElementById('md').textContent);
    const content = document.getElementById('content');
    content.innerHTML = marked.parse(md);

    content.querySelectorAll('pre code.language-mermaid').forEach((code) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });

    buildToc(content);
    markRows(content);

    document.querySelectorAll('.toolbar button[data-filter]').forEach((b) => {
      b.onclick = () => applyFilter(b.dataset.filter);
    });
    document.getElementById('btnPrint').onclick = () => window.print();

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: 'base',
      themeVariables: {
        fontFamily: '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
        fontSize: '14px'
      },
      flowchart: { useMaxWidth: true, htmlLabels: true, nodeSpacing: 40, rankSpacing: 45, wrappingWidth: 280 }
    });
    try {
      await mermaid.run({ querySelector: '.mermaid' });
    } catch (e) {
      console.warn('Mermaid 渲染失败', e);
    }
  }

  init();
})();
</script>
