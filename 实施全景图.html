<script type="text/markdown" id="md">"# Enterprise AI 客户现场实施全景图\n\n> **版本**：v2.3 ｜ **更新**：2026-11-07 ｜ **基线**：`515b80d`\n>\n> **定位**：本文件只描述**客户方现场实施阶段**：进场前准备 → 现场诊断 → 方案与范围 → 环境部署 → 数据与样本 → 试运行 → 培训上线 → 验收价值 → 移交运维。\n>\n> **不包含**：产品开发、CI、发布、架构选型、多租户/HA 运行底座。这些在 `内部开发与发布.md`。\n>\n> **系统边界（最容易搞错）**：诊断平台（`backend/` + `frontend/`）是**供应商内部工具，不部署到客户，客户不登录、不使用**；客户现场只部署和使用 **`ai-copilot`**。供应商在现场用诊断平台完成 S1 诊断、S2 方案、S5 价值核算。\n>\n> **HTML 版**：`实施全景图.html` 由 `scripts/build_impl_map.py` 从本文件生成，**不要手改 HTML**。HTML 会把 `[x]` / `[ ]` 渲染成复选框，并支持“只看未完成 / 只看已完成”。\n>\n> **适用**：供应商交付团队、客户项目组、客户 IT / 安全。\n\n---\n\n## 0. 铁律（摘要；权威与执行细节见 `AGENTS.md` §0）\n\n> **规则权威是 `AGENTS.md`**。本节只保留摘要；改规则先改 `AGENTS.md`，再同步本节，避免两处漂移。\n> **机械化**：`make preflight`；本地 `make install-hooks`；CI frontend job 运行同一脚本。\n\n1. **图先于改**：任何现场实施动作、配置、文档变更，开工前先在本图定位受影响节点；提交前再复核一次。\n2. **同一提交更新**：现场记录、配置、文档、状态、证据必须同一次提交更新。\n3. **完成只认证据**：`[x]` 必须有现场照片、签到、客户签字、截图、命令输出或工单记录；口头“应该没问题”不算。\n4. **外部项不冒充**：真实客户、真实环境、真实企微、真实样本未验证的，保持 `[ ]` / 🟡，不得写成已完成。\n5. **不包装 AI**：OCR、规则、脚本、人工复核、指标计算都是系统能力，不是大模型；合成样本必须标注“合成”。\n6. **无影响也要留痕**：判断本次改动不影响本图时，提交说明写 `图无影响：<原因>`。\n7. **每次发布更新**：更新顶部日期/基线、受影响节点、`VERIFICATION.md` 对应章节。\n8. **HTML 不手改**：改完 MD 必须 `make impl-map` 重新生成。\n9. **系统边界不混**：诊断平台不装客户、不给客户账号；客户只使用 ai-copilot。\n\n> 违反以上任一条，视为变更未完成，**不得合并、不得推送**。内部开发/CI 规则见 `AGENTS.md` 与 `内部开发与发布.md`。\n\n---\n\n## 1. 图例与状态定义\n\n| 标识 | 含义 | 判定标准 |\n|---|---|---|\n| ✅ | 已完成且有证据 | 现场记录 / 客户签字 / 命令通过 / 截图 |\n| 🟡 | 有准备，但外部未验证 | 需要真实客户、真实环境或第三方 |\n| ⬜ | 未开始 | 无实施动作或无证据 |\n| ⛔ | 阻塞 / 明确不做 | 依赖缺失或不在本期范围 |\n| 🔁 | 持续运行 | 每日 / 每周 / 每月执行 |\n| 🧍 | 人工确认点 | 必须有人复核或签字 |\n| 🤖 | 大模型参与 | 仅限明确标注节点；规则不算 |\n| ⚙️ | 规则 / 脚本 / 系统 | 不是 AI |\n\n**系统标记**：\n\n| 标记 | 含义 |\n|---|---|\n| 🏢 供应商 | 供应商内部使用，不部署到客户 |\n| 🏭 客户 | 部署在客户环境，客户实际使用 |\n| 🌐 双方 | 企微 / H5 / 浏览器等入口 |\n\n---\n\n## 2. 系统边界：谁用哪个系统\n\n```mermaid\nflowchart LR\n  subgraph V[供应商侧 🏢]\n    D[诊断平台<br/>backend + frontend<br/>不部署客户]\n    P[顾问 / PM / 实施 / 运维]\n  end\n\n  subgraph C[客户侧 🏭]\n    A[ai-copilot<br/>客户实际使用]\n    W[企业微信自建应用]\n    U[单证 / 财务 / 管理员]\n  end\n\n  P -->|S1 诊断 / S2 方案 / S5 价值| D\n  P -->|部署 / 调参 / 陪跑| A\n  U -->|文字 / 图片 / H5 / 批量| A\n  W -->|回调| A\n  A -->|结构化结果 / 确认| U\n  A -.->|POC 指标与版本<br/>不含原文| D\n\n  classDef vendor fill:#e8f0fb,stroke:#1f4e79,stroke-width:2px\n  classDef client fill:#d4f4dd,stroke:#2f855a,stroke-width:3px\n  class D,P vendor\n  class A,W,U client\n```\n\n| 系统 | 谁使用 | 部署位置 | 客户是否登录 | 现场用途 | 明确不做 |\n|---|---|---|---|---|---|\n| 诊断平台 `backend/` + `frontend/` | 供应商顾问 / PM / 实施 | 供应商 SaaS / 本机 | **否** | S1 诊断、S2 方案、S5 价值、POC 回写 | 不装客户、不给客户账号 |\n| `ai-copilot` | 客户单证 / 财务 / 管理员；供应商实施 | 客户服务器 / 客户可访问云 | **是** | 托书识别、确认、指标、学习 | 不承担供应商项目管理 |\n| 企业微信自建应用 | 客户员工 | 企业微信 + `ai-copilot` 回调 | 是（员工） | 文字 / 图片入口 | 不读已有聊天、不做会话存档 |\n\n> 一句话：**两个系统。一个我们用来管项目，不装给客户；一个是客户用的 AI 应用，装这个。**\n> 详细边界与落地 WBS 见 `会客包/12_系统边界与落地清单.md`。\n\n**两个“经营洞察”必须分开说**（2026-11-07 补充）：\n\n| 名称 | 位置 | 口径 | 客户是否可见 |\n|---|---|---|---|\n| S5 · 经营洞察 | 诊断平台 🏢 | 供应商在诊断/交付阶段对**客户项目**的判断：指标达标、续约风险、机会点前置条件 | **否** |\n| 客户侧经营洞察 | 客户侧（**当前未实现**） | 上线后客户自己长期看：营收、成本、毛利、回款、异常、AI 贡献 | 是（规划中，P2） |\n\n客户侧现在只有**运行指标 / 月报 / 风险模拟**，属于运营指标，不是经营洞察；客户侧经营洞察的前置是成本归集与 TMS/财务数据打通。\n\n---\n\n## 3. 总览脑图\n\n```mermaid\nmindmap\n  root((客户现场实施))\n    进场前\n      授权 范围 排期\n      客户四类人\n      环境清单\n      样本计划\n    现场诊断\n      供应商用诊断平台\n      访谈 流程 数据\n      四维盘点 机会点 ROI\n      诊断报告 G1\n    方案与范围\n      试点范围\n      集成清单\n      工作量 报价\n      验收口径 G2\n    环境与部署\n      客户侧 ai-copilot\n      域名 HTTPS 网络\n      企微应用 回调 可信IP\n      账号 角色 存储 OCR\n    数据与样本\n      脱敏 授权\n      20-50 份 POC\n      200 份评测集\n      金标 基线\n    试运行\n      3-5 名单证\n      双轨 2 周\n      差异复核\n      指标与风险\n    培训与上线\n      培训 1 小时\n      UAT 用例\n      上线检查\n      Go No-Go 回滚\n    验收与价值\n      客户签收\n      价值报告\n      续约 二期\n    移交与运维\n      运维交接\n      监控 告警\n      月度价值报告\n      规则维护\n    外部阻塞\n      授权 脱敏\n      样本 环境\n      企微图片真机\n```\n\n---\n\n## 4. 现场实施主线（约 6–7 周）\n\n```mermaid\nflowchart LR\n  P0[进场前 T-14~T-1<br/>授权 / 范围 / 环境清单] --> P1[W1 现场启动会<br/>四类人到场]\n  P1 --> S1[W1-W2 S1 现场诊断<br/>供应商用诊断平台]\n  S1 --> G1{G1 诊断确认}\n  G1 -->|客户确认| S2[W2 S2 方案与试点范围<br/>供应商用诊断平台]\n  G1 -->|未确认| PX[暂停 / 补资料]\n  S2 --> G2{G2 方案确认}\n  G2 -->|确认| D1[W2-W3 环境与部署<br/>客户侧 ai-copilot]\n  G2 -->|未确认| PX\n  D1 --> D2[W3-W4 数据与样本<br/>脱敏 / 200 份 / 金标]\n  D2 --> POC[W5-W6 试运行<br/>3-5 名单证 双轨 2 周]\n  POC --> G3{G3 试运行 Go/No-Go}\n  G3 -->|Go| T1[W6 培训 / UAT / 上线检查]\n  G3 -->|No-Go| PZ[复盘 / 调整范围]\n  T1 --> G4{G4 上线门禁}\n  G4 -->|通过| L1[上线 / 24-72h 保障]\n  G4 -->|不通过| T1\n  L1 --> A1[验收 / 价值报告 / 签收]\n  A1 --> G5{G5 价值确认}\n  G5 --> H1[移交运维 / 续约或二期]\n\n  classDef done fill:#d4f4dd,stroke:#2f855a,stroke-width:2px\n  classDef gate fill:#fff4e5,stroke:#b7791f,stroke-width:2px\n  classDef todo fill:#f1f5f9,stroke:#94a3b8,stroke-width:2px,stroke-dasharray:3 3\n  class P0,P1 done\n  class G1,G2,G3,G4,G5 gate\n  class S1,S2,D1,D2,POC,T1,L1,A1,H1,PX,PZ todo\n```\n\n**读图要点**\n\n- **诊断平台只在供应商侧**：S1/S2 的诊断与方案由供应商完成，客户只看报告、做确认。\n- **客户侧只装 ai-copilot**：环境、部署、账号、企微入口、备份、监控都在这一条线上。\n- **没有样本不试运行**：合成样例只能做演示，不能替代客户真实托书。\n- **没有验收口径不上线**：先定指标、目标、测量方法、责任人，再谈上线。\n- **没有回滚预案不上线**：上线前必须演一次恢复或回退。\n\n---\n\n## 5. 角色协作泳道\n\n```mermaid\nflowchart LR\n  subgraph K[客户侧]\n    K1[决策人 🧍]\n    K2[业务 owner 🧍]\n    K3[一线单证 / 财务 🧍]\n    K4[IT / 安全 🧍]\n  end\n\n  subgraph V[我方交付团队]\n    V1[销售 / 顾问]\n    V2[项目经理 PM]\n    V3[实施 / 交付]\n    V4[运维 / 值班]\n    V5[标注 / 评测]\n  end\n\n  subgraph P[系统]\n    P1[诊断平台 🏢<br/>供应商内部]\n    P2[ai-copilot 🏭<br/>客户使用]\n    P3[企微 / H5 / 批量 🌐]\n  end\n\n  K1 -->|授权 / 预算 / Go-No-Go| V1\n  K2 -->|范围 / 验收 / 协调| V2\n  K3 -->|样本 / 差异 / 试用| V3\n  K4 -->|环境 / 脱敏 / 安全| V3\n  V1 -->|诊断 / 方案 / 报价| P1\n  V2 -->|计划 / 门禁 / 验收| P1\n  V3 -->|部署 / 配置 / 陪跑| P2\n  V5 -->|金标 / 评测| P2\n  K3 --> P3\n  P3 --> P2\n  P2 -->|指标 / 价值| V2\n  V4 -->|监控 / 告警 / 回滚| P2\n\n  classDef cust fill:#e8f0fb,stroke:#1f4e79,stroke-width:2px\n  classDef vendor fill:#d4f4dd,stroke:#2f855a,stroke-width:2px\n  classDef sys fill:#f1f5f9,stroke:#64748b,stroke-width:2px\n  class K1,K2,K3,K4 cust\n  class V1,V2,V3,V4,V5 vendor\n  class P1,P2,P3 sys\n```\n\n**协作硬规则**\n\n- 客户侧必须有一个**总协调 owner**，负责找齐业务 owner、一线骨干、IT、安全四类人。\n- 我方 PM 对计划与验收负责；实施对部署与上线负责；运维对监控与回滚负责；标注/评测对金标质量负责。\n- **诊断平台账号只在我方团队内**；客户看报告、做确认，不登录诊断平台。\n- 任何跨角色交接都必须有**书面输入/输出**（模板、确认单、会议纪要、系统记录），不能只在聊天里说。\n\n---\n\n## 6. 现场诊断流程（供应商使用诊断平台）\n\n```mermaid\nflowchart TB\n  A[现场访谈 / 资料采集] --> B[S1 四维盘点<br/>痛点 / 流程 / 数据 / 组织]\n  B --> C[机会点 + ROI + 风险与局限]\n  C --> D[诊断报告 / 客户确认]\n  D --> G1{G1 诊断门禁}\n  G1 -->|通过| E[S2 方案 / 集成 / 工作量 / 报价 / 验收口径]\n  G1 -->|不通过| B\n  E --> G2{G2 方案门禁}\n  G2 -->|通过| F[试点范围与排期]\n  G2 -->|不通过| E\n\n  classDef gate fill:#fff4e5,stroke:#b7791f,stroke-width:2px\n  class G1,G2 gate\n```\n\n| 阶段 | 供应商做什么 | 客户做什么 | 产出 | 系统 |\n|---|---|---|---|---|\n| S1 现场诊断 | 访谈、流程梳理、四维盘点、机会点与 ROI | 提供资料、接受访谈、确认痛点 | 诊断报告、G1 确认 | 诊断平台 🏢 |\n| S2 方案与范围 | 方案、集成清单、工作量、报价、验收口径 | 确认范围、预算、验收标准 | 方案书、报价、G2 确认 | 诊断平台 🏢 |\n| S5 价值核算 | 指标字典、目标、快照、价值报告 | 提供运营数据、确认口径 | 价值报告、续约建议 | 诊断平台 🏢 |\n\n**边界与纪律**\n\n- 诊断平台**不部署到客户服务器**，也不给客户开账号；客户确认的是报告和范围，不是系统。\n- 访谈记录、诊断报告、报价在导出给客户前必须脱敏；真实联系人、合同价、内部成本不得外发。\n- G1/G2 不是文档检查，是**系统校验 + 客户书面确认**；只有系统校验没有客户确认，不能算通过。\n- 诊断结论必须区分：**事实**（客户原话/数据）、**判断**（我方分析）、**假设**（待验证）。不得把假设写成结论。\n\n---\n\n## 7. ai-copilot 现场部署流程（客户侧）\n\n```mermaid\nflowchart TB\n  A[环境确认<br/>服务器 / 域名 / HTTPS / 网络 / 可信 IP] --> B[安装依赖<br/>Python 3.11 / venv / OCR / DB]\n  B --> C[配置 .env<br/>ADMIN / DB / 存储 / 企微 / 模型]\n  C --> D[启动与自检<br/>health / smoke / OCR / storage]\n  D --> E[企微应用<br/>回调 URL / Token / AESKey / Secret / AgentID]\n  E --> F[账号与角色<br/>admin / operator / finance / viewer]\n  F --> G[入口验证<br/>文字 / 图片 / H5 / 批量 / 网页]\n  G --> H[上线检查<br/>备份 / 回滚 / 监控 / 告警]\n  H --> I{环境就绪}\n  I -->|是| J[进入数据与试运行]\n  I -->|否| A\n\n  classDef gate fill:#fff4e5,stroke:#b7791f,stroke-width:2px\n  class I gate\n```\n\n### 7.1 三种部署形态\n\n| 形态 | 模型在哪 | OCR 在哪 | 适用 |\n|---|---|---|---|\n| A. 供应商云上 SaaS | 境内模型 API | 供应商服务器 | 小客户，最快 |\n| B. 客户内网私有化 | 客户 GPU + 本地模型 | 客户服务器 | 大客户、数据敏感 |\n| **C. 混合（推荐）** | 境内模型 API（脱敏后调用） | **客户内网** | 大多数集卡客户 |\n\n> C 最划算：票据图片不出内网，只送脱敏文本给模型。选型必须在进场前和客户 IT 确认，不能到现场再改。\n\n### 7.2 部署必查项\n\n| 项 | 要求 | 检查方法 |\n|---|---|---|\n| 服务器 | CPU / 内存 / 磁盘满足 OCR 与并发 | `free -h`、`df -h` |\n| 域名与 HTTPS | 固定域名、有效证书；企微回调必须 HTTPS | 浏览器 / `curl -I` |\n| 网络 | 客户内网到模型网关、企微 API 可达 | `curl` 目标地址 |\n| 可信 IP | 企微应用配置出口 IP | 企微后台截图 |\n| Python | 3.11 + `.venv`，不用系统 Python | `python -V` |\n| OCR | RapidOCR / onnxruntime 可用 | `/api/health` 的 `ocr_ready` |\n| 数据库 | SQLite 或 PostgreSQL；多实例必须 PostgreSQL | `DATABASE_URL` |\n| 存储 | local 或 S3；多实例必须共享存储 | 上传后另一实例可读 |\n| 账号 | admin 首登改密；四角色按需开通 | `/users` |\n| 备份 | 每日备份 + 恢复演练 | 备份文件 + 恢复记录 |\n| 监控 | `/metrics` 可抓取；日志可查 | Prometheus / 日志 |\n| 回滚 | 上一版本可启动；数据迁移可回退 | 回滚演练记录 |\n\n### 7.3 关键环境变量\n\n```env\n# 管理员与数据库\nADMIN_EMAIL=admin@客户域名\nADMIN_PASSWORD=首次登录后立即修改\nDATABASE_URL=postgresql://...            # 单机可留空用 SQLite\nDB_PATH=data/app.db\n\n# 企微入口\nWECOM_TOKEN=企微后台 Token\nWECOM_CORPID=企业 CorpID\nWECOM_ENCODING_AES_KEY=43 位 Key\nWECOM_SECRET=应用 Secret                 # 图片下载与主动推送\nWECOM_AGENTID=应用 AgentId\nWECOM_IMAGE_MAX_MB=10\n\n# 存储与模型（可选）\nSTORAGE_BACKEND=local                    # local / s3\nLLM_BASE_URL=...\nLLM_API_KEY=...                          # 留空 = 纯规则\nLLM_MODEL=...\n```\n\n> 真实值只写客户环境的 `.env`，不提交仓库、不发聊天、不截图外传。\n\n---\n\n## 8. 数据、样本与试运行\n\n```mermaid\nflowchart LR\n  A[样本清单与授权] --> B[脱敏]\n  B --> C[扫描 / 配对]\n  C --> D[20-50 份 POC 样本]\n  D --> E[跑解析 / 人工复核]\n  E --> F[差异分类 / 规则与阈值调整]\n  F --> G[200 份评测集 + gold.csv]\n  G --> H[基线指标]\n  H --> I[试运行 2 周<br/>3-5 名单证 双轨]\n  I --> J{Go / No-Go}\n  J -->|Go| K[进入培训与上线]\n  J -->|No-Go| L[复盘 / 调整范围]\n\n  classDef gate fill:#fff4e5,stroke:#b7791f,stroke-width:2px\n  class J gate\n```\n\n**样本规则**\n\n- 样本必须有**来源、数量、字段、授权状态、脱敏方式**；没有授权的样本不进场。\n- 合成样本必须显式标注“合成 / 演示”；**合成准确率不能当客户真实准确率**。\n- 金标标的是**原文写了什么**，不是业务上“应该是什么”；箱号校验失败也不改金标原值。\n- POC 先跑 20–50 份，差异复核后再扩到 200 份；不要一上来跑全量。\n- 试运行必须**双轨**：旧流程继续跑，新系统并行；否则无法比较节省与错误。\n- 指标至少包括：字段准确率、整单准确率、绕过率、自动通过率、人工修正率、单均耗时、节省工时。\n\n---\n\n## 9. 培训、上线、验收与移交\n\n```mermaid\nflowchart LR\n  A[培训 1 小时] --> B[UAT 用例]\n  B --> C{UAT 通过}\n  C -->|否| D[修复 / 复测]\n  D --> B\n  C -->|是| E[上线检查表]\n  E --> F{Go / No-Go}\n  F -->|No-Go| G[延期 / 回滚预案]\n  F -->|Go| H[上线]\n  H --> I[24-72h 监控]\n  I --> J[验收 / 价值报告]\n  J --> K[客户签收]\n  K --> L[移交运维]\n\n  classDef gate fill:#fff4e5,stroke:#b7791f,stroke-width:2px\n  class C,F gate\n```\n\n### 9.1 培训\n\n| 对象 | 内容 | 时长 | 考核 |\n|---|---|---|---|\n| 单证员 | 企微发文字/图片、H5 拍照、批量导入、确认/改单 | 45 分钟 | 独立完成 3 单 |\n| 财务 | 费用检查、对账/结算入口、导出 | 30 分钟 | 独立完成 1 单 |\n| 管理员 | 用户与角色、阈值、学习队列、备份/监控 | 30 分钟 | 能建账号、能看指标 |\n| 客户 IT | 部署结构、日志、备份、回滚、告警 | 30 分钟 | 能按手册重启/恢复 |\n\n### 9.2 上线门禁（G4）\n\n| 项 | 必须有 | 没有就 |\n|---|---|---|\n| UAT | 用例、结果、客户签字 | 不上线 |\n| P0/P1 缺陷 | 全部关闭或有客户接受的替代方案 | 不上线 |\n| 回滚 | 上一版本、回滚步骤、回滚窗口 | 不上线 |\n| 监控 | 错误率、P95、失败批次、企微图片指标 | 不上线 |\n| 培训 | 签到表 + 操作说明 | 不上线 |\n| 签收 | 上线检查表客户签字 | 不上线 |\n\n### 9.3 验收与价值（G5）\n\n| 项 | 内容 | 证据 |\n|---|---|---|\n| 验收口径 | 指标、目标、测量方法、责任人 | 双方确认单 |\n| 价值报告 | 节省工时、修正率、绕过率、风险拦截 | 可追溯快照 |\n| 客户签收 | 验收报告签字/邮件 | 签字件 |\n| 续约/二期 | 下一阶段范围与建议 | 会议纪要 |\n\n### 9.4 移交清单\n\n- 运维手册、部署手册、回滚步骤、备份恢复记录。\n- 管理员账号、角色清单、密码策略、离职/转岗处理。\n- 监控面板、告警接收人、值班表（真实联系人**不提交仓库**）。\n- 月度价值报告节奏、规则维护窗口、版本回归计划。\n- 数据留存期限、导出/删除流程、合同到期后的数据处理约定。\n\n---\n\n## 10. 现场实施检查表\n\n> 状态说明：`[x]` 有证据；`[ ]` 未完成或外部未验证。每项右侧写证据或命令，禁止空勾。\n> 本表只覆盖客户现场实施；开发/CI/架构证据见 `内部开发与发布.md`。\n\n### 10.1 进场前准备（PREP）\n\n| ID | 检查项 | 状态 | 证据 / 验收 |\n|---|---|---|---|\n| PREP-01 | 现场实施清单模板（本图 §10） | [x] | 本文件 |\n| PREP-02 | 环境清单模板（本图 §7.2） | [x] | 本文件 |\n| PREP-03 | 数据需求与金标模板 | [x] | `会客包/试点一/01_数据需求清单.xlsx`、`02_金标标注模板.xlsx` |\n| PREP-04 | 培训材料与操作说明 | [x] | `会客包/托书结构化试用指南.md`、`ai-copilot/docs/运维手册.md` |\n| PREP-05 | 上线检查/回滚模板 | [x] | 本图 §9.2、`ai-copilot/docs/运维手册.md` |\n| PREP-06 | 验收/价值报告模板 | [x] | `会客包/12_系统边界与落地清单.md` §八 |\n| PREP-07 | 客户四类人名单与联系方式 | [ ] | 客户确认单 |\n| PREP-08 | 进场排期、场地、网络、门禁 | [ ] | 邮件/会议纪要 |\n| PREP-09 | 客户授权与项目范围确认 | [ ] | 签字/邮件/确认单 |\n| PREP-10 | 数据处理与脱敏约定 | [ ] | 数据清单 + 脱敏规则 |\n| PREP-11 | 环境预检结果 | [ ] | 服务器/域名/网络检查表 |\n\n### 10.2 审窗口 | 客户 PM |\n| EXT-06 | 试点环境 | [ ] | 域名、网络、账号、回滚窗口 | 客户 IT / 我方运维 |\n| EXT-07 | 验收口径 | [ ] | 指标、目标、测量方法、责任人 | 双方 |\n| EXT-08 | 200 份脱敏托书 + `gold.csv` | [ ] | 样本清单 + 标注记录 | 客户一线 + 标注 |\n| EXT-09 | POC 运行记录 + 人工复核 | [ ] | run_no、配置、指标、复核人 | 我方 + 客户 |\n| EXT-10 | UAT 报告 + 上线检查表签收 | [ ] | 客户签字 | 客户业务 owner |\n| EXT-11 | 上线后 24–72h 监控记录 | [ ] | 错误率、P95、导出失败 | 我方运维 |\n| EXT-12 | 价值报告 + 续约/二期建议 | [ ] | 可追溯快照/价值记录 | 我方 + 客户 |\n| EXT-13 | 企微图片通道：应用 Secret / AgentID / 可信 IP / 固定域名 | [ ] | 管理后台截图 + 真机联调记录 | 客户 IT / 企微管理员 |\n\n### 10.11 交付能力摘要（现场可用性）\n\n> 本表只回答“现场能不能用”；详细开发证据与状态见 `内部开发与发布.md` §3.3。\n\n| 能力 | 现场可用性 | 说明 |\n|---|---|---|\n| 企微文字消息 | ✅ | 已支持安全模式、分条录入、确认入库 |\n| 企微图片消息 | 🟡 | 代码完成、Mock 自检通过；真实企微端到端见 EXT-13 |\n| H5 拍照/上传 | ✅ | 系统文件选择器/相机，不做网页内实时预览 |\n| 网站粘贴/上传 | ✅ | 临时试用入口 |\n| 批量导入 PNG/PDF/TXT | ✅ | 200 文件、单文件 ≤10MB；默认规则 + 脱敏 |\n| OCR + 规则抽取 | ✅ | RapidOCR + 规则；数字级误识仍需人工复核 |\n| 模型补空 | 🟡 | `fill_only`，失败回退规则；真实模型联调未验证 |\n| 分级审批 / 人工确认 | ✅ | single / double / blocked，改单留痕 |\n| 学习队列 / 金标 | ✅ | 标注、导出 JSONL；真实样本 0 份 |\n| 指标与价值 | ✅ | 绕过率、自动通过率、修正率、节省工时 |\n| 回写诊断平台 | ✅ | 仅指标与版本，不含原文；幂等 + 重试 |\n| 客户侧经营洞察 | ⛔ | **未实现（P2）**；现有运行指标/月报只是运营指标，不含营收、成本、毛利、单车盈利；前置为成本归集 + TMS/财务数据 |\n| TMS 写回 | ⛔ | **未实现（C2）**；需客户 TMS 接口文档；当前退路是 CSV 导出、人工回填 |\n| 个人微信 / 会话内容存档 | ⛔ | 个人微信无官方接口；会话存档需许可/授权/密钥/合规，当前不做 |\n\n---\n\n## 11. 角色 RACI（谁负责、谁拍板）\n\n> R = 执行；A = 最终负责/拍板；C = 需咨询；I = 需知会。\n\n| 活动 | 客户决策人 | 客户业务 owner | 客户一线 | 客户 IT/安全 | 销售/顾问 | 我方 PM | 实施/交付 | 运维 | 标注/评测 |\n|---|---|---|---|---|---|---|---|---|---|\n| 授权 / 预算 | A | C | I | C | R | I | I | I | I |\n| 范围 / 验收口径 | A | R | C | C | C | R | C | I | I |\n| 现场诊断 | I | A | C | I | R | C | I | I | I |\n| 方案 / 报价 | A | C | I | I | R | R | C | I | I |\n| 环境 / 部署 | I | I | I | A | I | C | R | C | I |\n| 样本 / 脱敏 | I | A | R | C | I | C | C | I | C |\n| 试运行 / POC | I | A | R | C | C | R | R | I | C |\n| 培训 / UAT / 上线 | A | R | R | C | I | A | R | C | I |\n| 监控 / 告警 | I | I | I | C | I | C | C | R/A | I |\n| 验收 / 价值 | A | R | C | I | R | C | C | I | I |\n| 移交 / 运维 | I | C | I | A | I | R | C | R | I |\n\n**硬规则**\n\n- 每行只能有一个 `A`；没有 `A` 的活动不允许启动。\n- 客户侧 `A` 不落地时，项目只能停在“方案/样例”，不能进入“真实试点/上线”。\n- 标注/评测的 `A` 不能由写规则/提示词的人兼任，避免自己标自己。\n- 诊断平台的账号与操作权限只在我方；客户不登录诊断平台。\n\n---\n\n## 12. 现场运行节奏\n\n| 时点 | 动作 | 负责 | 证据 |\n|---|---|---|---|\n| T-14 | 授权、范围、环境清单、样本计划 | PM | 确认单 |\n| T-7 | 四类人确认、排期、网络/门禁 | PM + 客户 | 会议纪要 |\n| T-1 | 环境预检、回滚预案、物料检查 | 实施 | 检查表 |\n| 现场每日 | 站会、问题清单、风险登记 | PM | 日会纪要 |\n| 每周 | 诊断/试运行复盘、指标复核 | PM + 客户 owner | 周报 |\n| 上线 24–72h | 监控、问题闭环、回滚待命 | 运维 | 监控截图 |\n| 验收后 | 移交、月度价值报告、规则维护 | PM + 运维 | 签收/报告 |\n\n---\n\n## 13. 常见实施错误（防再犯）\n\n| # | 错误做法 | 正确做法 |\n|---|---|---|\n| 1 | 把诊断平台装到客户服务器 | 诊断平台只在我方，不部署客户 |\n| 2 | 给客户开诊断平台账号 | 客户只看报告、做确认；账号只在我方 |\n| 3 | 把诊断平台页面当客户交付物演示（典型：客户老板版 PPT 放 S5 经营洞察截图） | 客户侧只演示 ai-copilot；S5 经营洞察是供应商内部诊断口径，客户不登录，且截图会带出「平台租户 / 协作审计 / 报价 / 续约风险」等内部信息。**2026-11-07 已删除该页（14→13 页）** |\n| 4 | 没有授权/脱敏就收样本 | 先签授权与脱敏约定，再收样本 |\n| 5 | 没有验收口径就上线 | 先定指标、目标、测量、责任人 |\n| 6 | 没有回滚预案就上线 | 先演一次恢复/回退 |\n| 7 | 拿合成样本准确率当客户真实准确率 | 标注“合成”，用客户 200 份样本重跑 |\n| 8 | 把 OCR/规则说成大模型 | 按系统能力讲，只有 `fill_only` 标 🤖 |\n| 9 | 企微图片未配 Secret/AgentID 就承诺可用 | 先配通道并真机验证；否则明确走 H5 |\n| 10 | 只配临时隧道就上线 | 固定域名 + 可信 IP + HTTPS |\n| 11 | 多实例不共享存储 | 共享 `data/batches` 或用 S3 |\n| 12 | 只培训管理员，不培训一线 | 单证、财务、管理员、IT 都要培训 |\n\n---\n\n## 14. 相关文档\n\n| 文档 | 关系 |\n|---|---|\n| `内部开发与发布.md` | 产品开发、CI、发布、架构、多租户/HA（内部，不发给客户） |\n| `会客包/12_系统边界与落地清单.md` | 两个系统的边界、6–7 周落地 WBS、部署形态 |\n| `ai-copilot/docs/运维手册.md` | 客户侧部署、配置、故障处理 |\n| `ai-copilot/WECOM_BINDING.md` | 企微自建应用绑定与图片通道 |\n| `会客包/托书结构化试用指南.md` | 客户试用与入口说明 |\n| `VERIFICATION.md` | 全项目证据总账 |\n| `AGENTS.md` | 协作铁律与验证顺序 |\n\n---\n\n## 15. 维护记录\n\n| 版本 | 日期 | 基线 | 变更 |\n|---|---|---|---|\n| v2.3 | 2026-11-07 | `515b80d` | 客户老板版 PPT 第 5 页文案校正：「把差异分到动作」→「分到处理决定」，「有负责人」→「有处理记录」；演示数据改为 8 条一致 / 2 条金额不符 / 1 条系统无此单 / 1 条客户漏单；明确对账匹配为规则、模型只在 `explain=true` 时解释 |\n| v2.2 | 2026-11-07 | `5fc18a0` | 客户老板版 PPT 删除「从数据到结论（经营洞察）」页：该页用诊断平台 S5 截图，客户不登录且含内部报价/续约信息；页数 14→13，讲稿与页码同步，大模型页与四步路径改用「经营指标 / 月报」口径 |\n| v2.1 | 2026-11-07 | `d983fa5` | 记录两个“经营洞察”的区别：S5 经营洞察为供应商内部诊断口径，客户侧经营洞察未实现（P2）；TMS 写回未实现（C2）；补充“客户 PPT 放诊断平台截图”的实施错误 |\n| v2.0 | 2026-11-07 | `6586461` | 重构为**客户现场实施**单一事实源：移除开发/CI/架构阶段，移到 `内部开发与发布.md`；明确诊断平台不部署客户、客户只用 ai-copilot |\n| v1.4 | 2026-11-07 | `74132b5` | 企微图片：media_id 下载、异步 OCR、主动推送、MsgId 幂等；自检 16/16 |\n| v1.3 | 2026-11-07 | `202549f` | 铁律可执行化：preflight 脚本、Git hooks、CI 校验；规则权威归位 `AGENTS.md` |\n| v1.2 | 2026-11-07 | `e87e65d` | 复核 v1.1 改动并推送；run #126 四 job 全绿 |\n| v1.1 | 2026-11-07 | `e4e2b96` | 新增 CI 同步校验；run #125 四 job 全绿；CI-11 关闭 |\n| v1.0 | 2026-11-07 | `c3b37ac` | 首版：脑图、阶段主线、角色泳道、发布闭环、AI 托书、多租户、客户试点、逐项检查表、RACI、铁律 |\n\n> 下次复核：**每次现场实施变更**；至少每周一次全量核对。发现图与现场记录/证据不一致，先修图再继续实施。\n"</script>

<script>
(function () {
  const STATS = {"done": 8, "todo": 86, "total": 94, "percent": 8.5, "partial": 4, "blocked": 4};

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function ensureLibs() {
    if (!window.marked) {
      await loadScript('https://cdn.jsdelivr.net/npm/marked@16/lib/marked.umd.js');
    }
    if (!window.mermaid) {
      await loadScript('https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.min.js');
    }
  }

  function buildToc(root) {
    const toc = document.getElementById('toc');
    const nodes = root.querySelectorAll('h2, h3');
    let i = 0;
    nodes.forEach((h) => {
      i += 1;
      if (!h.id) h.id = 'sec-' + i;
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = h.tagName === 'H3' ? 'lv3' : '';
      toc.appendChild(a);
    });
  }

  function markRows(root) {
    // 表格里的 `[x]` / `[ ]` 不是列表任务项，marked 不会渲染成复选框；
    // 这里把状态列转成真正的复选框，才能做“只看未完成/已完成”筛选。
    root.querySelectorAll('td').forEach((td) => {
      const t = (td.textContent || '').trim();
      if (t === '[x]' || t === '[X]') {
        td.innerHTML = '<input type="checkbox" checked disabled aria-label="已完成">';
      } else if (t === '[ ]') {
        td.innerHTML = '<input type="checkbox" disabled aria-label="未完成">';
      }
    });

    root.querySelectorAll('table').forEach((table) => {
      if (table.querySelector('input[type=checkbox]')) table.classList.add('checklist');
    });
    root.querySelectorAll('tr').forEach((tr) => {
      if (tr.querySelector('th')) tr.classList.add('header-row');
      const cb = tr.querySelector('input[type=checkbox]');
      if (!cb) return;
      tr.classList.add(cb.checked ? 'done-row' : 'todo-row');
      if (/⛔/.test(tr.textContent || '')) tr.classList.add('blocked-row');
    });
    root.querySelectorAll('li').forEach((li) => {
      const cb = li.querySelector('input[type=checkbox]');
      if (!cb) return;
      li.classList.add(cb.checked ? 'done-row' : 'todo-row');
    });
  }

  function applyFilter(mode) {
    const content = document.getElementById('content');
    content.classList.remove('only-todo', 'only-done');
    if (mode === 'only-todo') content.classList.add('only-todo');
    if (mode === 'only-done') content.classList.add('only-done');
    document.querySelectorAll('.toolbar button[data-filter]').forEach((b) => {
      b.classList.toggle('on', b.dataset.filter === mode);
    });
  }

  async function init() {
    try {
      await ensureLibs();
    } catch (e) {
      document.getElementById('content').innerHTML =
        '<p class="error">缺少 marked / mermaid，且 CDN 加载失败。请在有网络时打开，或在仓库根目录安装前端依赖后重试。</p>';
      return;
    }

    marked.setOptions({ gfm: true, breaks: false });
    const md = JSON.parse(document.getElementById('md').textContent);
    const content = document.getElementById('content');
    content.innerHTML = marked.parse(md);

    content.querySelectorAll('pre code.language-mermaid').forEach((code) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });

    buildToc(content);
    markRows(content);

    document.querySelectorAll('.toolbar button[data-filter]').forEach((b) => {
      b.onclick = () => applyFilter(b.dataset.filter);
    });
    document.getElementById('btnPrint').onclick = () => window.print();

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: 'base',
      themeVariables: {
        fontFamily: '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
        fontSize: '14px'
      },
      flowchart: { useMaxWidth: true, htmlLabels: true, nodeSpacing: 40, rankSpacing: 45, wrappingWidth: 280 }
    });
    try {
      await mermaid.run({ querySelector: '.mermaid' });
    } catch (e) {
      console.warn('Mermaid 渲染失败', e);
    }
  }

  init();
})();
</script>
